te entre as máquinas","Latência de rede e possibilidade de falhas na transmissão","Eliminação das chamadas ao kernel e da cópia de dados","Um relógio global único compartilhado pelos nós"],"C","Em SDs, a comunicação depende da rede, acrescentando latência e possibilidade de falhas."],[4,"No diagrama de IPC, as etapas S1 e S3 ocorrem em modo usuário e a S2 em modo kernel. Qual é a diferença entre esses modos?",["Os dois modos possuem exatamente o mesmo nível de privilégio","O modo usuário é reservado à JVM e o modo kernel aos demais programas","O modo kernel existe apenas no Windows; no Linux só há modo usuário","Modo usuário tem alto privilégio; modo kernel tem baixo privilégio","Modo usuário tem baixo privilégio; modo kernel tem alto privilégio"],"E","Modo usuário = baixo privilégio; modo kernel = alto privilégio."],[4,"O que faz o escalonador (scheduler) do SO?",["Registra os objetos remotos por nome para acesso pela rede","Gerencia a gravação dos arquivos no disco","Compila os programas e gera o código binário antes de executá-los","Desenha a interface gráfica das aplicações","Decide qual processo executa, quando e por quanto tempo"],"E","O escalonador decide qual processo executa, quando e por quanto tempo."],[4,"Em um único núcleo de processamento, o compartilhamento de tempo permite que:",["as tarefas sejam distribuídas automaticamente entre máquinas","nenhum chaveamento de contexto seja necessário entre tarefas","várias tarefas executem exatamente no mesmo instante de tempo","apenas uma tarefa execute por vez, até terminar completamente","várias tarefas progridam, mas só uma execute a cada instante"],"E","Com um núcleo, várias tarefas progridem concorrentemente, mas só uma executa em cada instante. Em multinúcleo, podem executar simultaneamente."],[4,"No funcionamento do escalonador, o que é o quantum?",["O identificador único atribuído a cada processo na tabela","O tamanho da pilha de execução reservada para cada thread","A fatia de tempo em que o processo executa","O número de núcleos físicos disponíveis no processador","A prioridade máxima que um processo pode receber do SO"],"C","O quantum é a fatia de tempo de execução de um processo; ao final, uma interrupção transfere o controle ao SO."],[4,"O que é a interrupção preemptiva?",["A criação de uma nova thread dentro do processo em execução","A retirada forçada do processo da CPU ao fim do seu quantum","A espera do processo pela conclusão de uma operação de E/S","Uma falha de hardware que interrompe todos os processos","O encerramento voluntário do processo ao concluir sua tarefa"],"B","Interrupção preemptiva: forçada após o esgotamento do quantum, retirando o processo da CPU (preempção)."],[4,"De onde vem o sinal que permite ao SO retomar o controle ao fim do quantum, e qual fator é decisivo na escolha do próximo processo?",["Do RMI Registry; a ordem alfabética dos nomes dos processos","De uma ação do usuário; o tamanho do processo em memória","Do relógio de hardware (sinal assíncrono); a prioridade","Do controlador de disco; o horário de criação do processo","Da interface de rede; o endereço IP de origem do processo"],"C","Um sinal assíncrono do relógio de hardware gera a interrupção, e a prioridade é fator decisivo na escolha dos processos em espera."],[4,"Sobre as políticas de escalonamento, é correto afirmar que:",["são definidas pela JVM para todos os processos do sistema","ignoram a prioridade e atendem os processos por ordem de chegada","são idênticas em todos os SOs, pois seguem um padrão internacional","só existem em sistemas multinúcleo, não em CPUs de um núcleo","variam por SO e consideram prioridade e resposta de apps interativos"],"E","As políticas variam por SO e geralmente consideram prioridade e responsividade de aplicações interativas."],[4,"Qual é a definição de thread apresentada?",["A menor unidade de execução escalonável, executada dentro de um processo","Um processo independente, com espaço de memória totalmente isolado","Um programa armazenado em disco que ainda não foi carregado na memória","Um objeto remoto registrado no RMI Registry para acesso pela rede","Um núcleo físico do processador capaz de executar instruções"],"A","Thread é a menor unidade de execução escalonável; para Tanenbaum, uma sequência de instruções executada de forma independente dentro de um processo."],[4,"Qual item NÃO é compartilhado entre threads de um mesmo processo, pois faz parte do contexto de execução próprio de cada thread?",["Conexões de rede","Pilha de execução","Espaço de endereçamento","Memória do processo","Arquivos abertos"],"B","Cada thread tem contexto próprio: contador de programa, registradores e pilha. Memória, arquivos abertos e conexões de rede são compartilhados."],[4,"Por que a comunicação entre threads geralmente tem menor custo do que a comunicação entre processos?",["Porque as threads não precisam de tempo de CPU para se comunicar","Porque as threads nunca sofrem chaveamento de contexto","Porque as threads sempre executam em núcleos diferentes","Porque as threads se comunicam pela rede, que é mais rápida","Porque compartilham a memória do processo, dispensando o IPC"],"E","Threads do mesmo processo compartilham a memória, acessando dados comuns sem IPC; mas isso exige cuidado com acesso simultâneo."],[4,"No exemplo do editor de texto multithread, quais atividades são atribuídas às threads?",["Abrir o arquivo, fechar o arquivo e enviar para a impressora","Ler o contador, somar uma unidade e atualizar o novo valor","Pensar, pegar os dois garfos, comer e devolver os garfos","Tratar a digitação, verificar a ortografia e salvar o documento","Compilar o código, linkar as bibliotecas e executar o programa"],"D","Uma thread processa a digitação, outra faz a verificação ortográfica e a terceira salva periodicamente."],[4,"Um navegador carrega arquivos em segundo plano enquanto o usuário continua interagindo com a página. Qual motivo para usar múltiplas threads isso ilustra?",["Reduzir o número de processos","Explorar as threads de hardware","Garantir a atomicidade dos dados","Ocultar a latência de comunicação","Evitar a ocorrência de deadlock"],"D","O material cita o navegador carregando arquivos em segundo plano como exemplo de ocultar a latência de comunicação."],[4,"Sobre o uso de múltiplas threads, qual afirmação está correta?",["Criar mais threads sempre aumenta o desempenho da aplicação","Threads só trazem benefício em computadores com um único núcleo","Threads não podem ser usadas em servidores que atendem requisições","Mais threads não garante mais desempenho, por custos de coordenação","O uso de threads elimina a necessidade de qualquer sincronização"],"D","Mais threads não significa automaticamente mais desempenho; criação e coordenação têm custos."],[4,"Em um processador multicore, threads de um mesmo processo executando simultaneamente em núcleos distintos caracterizam:",["Concorrência sem simultaneidade","Condição de corrida","Paralelismo real","Deadlock","Preempção"],"C","Em multicore, threads em núcleos distintos executam ao mesmo tempo: paralelismo real. Com um núcleo, há apenas intercalação (concorrência)."],[4,"O que são threads de hardware, que “não devem ser confundidas” com threads de software?",["Threads internas criadas pela JVM, como o garbage collector e o finalizer","Processos do kernel executados em modo privilegiado pelo sistema","Contextos de execução de um núcleo físico, como os oferecidos pelo SMT","Trilhas físicas da placa-mãe que ligam o processador à memória RAM","Threads de software que estão bloqueadas aguardando uma operação de E/S"],"C","Thread de hardware é um contexto de execução oferecido por um núcleo físico; o SMT (Simultaneous Multithreading) permite vários contextos por núcleo."],[4,"Quais linguagens são citadas como tendo suporte nativo a multithreading?",["JSON, XML e YAML","Java, C#, C++ e Python","HTML, CSS e SQL","Apenas C e Assembly","Apenas Java e Kotlin"],"B","O material cita Java, C#, C++ e Python como linguagens com supor e criar threads estendendo a classe Thread?",["Não aproveita processadores multinúcleo","Não é possível chamar o método start()","Não é possível sobrescrever o método run()","A subclasse não pode herdar de outra classe","A thread sempre roda dentro da thread main"],"D","É mais simples, mas a subclasse de Thread fica impedida de herdar de outra classe."],[4,"Sobre a classe Thread do Java, qual afirmação é correta segundo o material?",["Thread é uma interface, não uma classe","A classe Thread implementa a interface Runnable","Thread e Runnable não têm nenhuma relação","A interface Runnable estende a classe Thread","Thread pertence a java.util.concurrent.locks"],"B","A classe Thread (java.lang) implementa a interface Runnable."],[4,"Qual método deve ser invocado para iniciar uma nova linha de execução que executará o método run()?",["join()","lock()","run()","execute()","start()"],"E","start() inicializa a nova thread, que então executa run(). Chamar run() diretamente apenas executa o método na thread atual."],[4,"No exemplo do vetor de 1000 posições preenchido por 10 threads, por que a impressão podia mostrar valores zerados?",["Porque a main imprimiu antes de todas as threads terminarem","Porque as threads entraram em deadlock disputando o vetor","Porque o vetor foi declarado com tamanho menor que o necessário","Porque o Java não permite criar mais de 8 threads por vez","Porque todas as threads escreviam na mesma posição do vetor"],"A","As threads executam de forma independente e assíncrona; a main imprimiu antes de todas terminarem."],[4,"Qual método faz a thread que o invoca aguardar a conclusão da thread referenciada?",["join()","tryLock()","yield()","start()","sleep()"],"A","join() faz a thread chamadora aguardar a conclusão da thread referenciada; resolve o problema da impressão antecipada."],[4,"No exemplo “forçando o erro”, a thread que recebe o intervalo 200 a 299 do vetor é pausada por 3 s com sleep(). Qual é o objetivo disso?",["Melhorar o desempenho geral enos, por incremento perdido","Esperado 10; pode acabar dando 20 por duplicação","Esperado 20; o resultado será sempre maior que 20","Esperado 0; o programa trava antes de incrementar"],"B","O esperado é 20, mas sem controle a Thread-A pode ler, ser interrompida, a Thread-B incrementar, e a A sobrescrever com o valor antigo: perde-se um incremento."],[4,"No exemplo de race condition do contador, em qual momento a interrupção pelo escalonador causa a perda de um incremento?",["Durante a espera da thread main no método join()","Depois que as duas threads terminaram suas execuções","Antes da criação das threads pelo método principal","Logo depois que a thread grava o novo valor no contador","Entre a leitura do valor e a gravação do novo valor"],"E","Se a thread é interrompida após ler e antes de atualizar, a outra thread pode atualizar, e a primeira depois sobrescreve com o valor antigo."],[4,"No exemplo de race condition, o código inicia a Thread-A primeiro, mas na prática a Thread-B foi escalonada antes. O que isso demonstra?",["Que start() executa as threads em ordem alfabética","Que a Thread-A entrou em deadlock ao ser criada","Que o método join() falhou na thread principal","Que não controlamos a ordem do escalonador do SO","Um erro de compilação na ordem das chamadas"],"D","A ordem de execução depende do escalonador do SO; por isso o resultado pode variar a cada execução."],[4,"O que é a seção crítica?",["O método main(), que inicia e coordena todas as threads do programa","O trecho que acessa recursos compartilhados e pode gerar inconsistência","A parte sequencial do programa, segundo a fórmula da Lei de Amdahl","O bloco catch responsável por tratar as exceções lançadas pelo código","A camada de aplicação da arquitetura de computação em grade"],"B","Seção crítica é o trecho que acessa recursos compartilhados e cuja execução concorrente pode gerar inconsistência (ex.: o incremento do contador)."],[4,"O que é a exclusão mútua (mutex)?",["Mecanismo que libera todas as threads para executar a seção crítica juntas","Situação de espera circular em que nenhuma das threads prossegue","Protocolo de rede que garante a entrega ordenada das mensagens","Técnica que elimina as threads concorrentes, deixando apenas a main","Mecanismo que deixa uma thread por vez na seção crítica protegida"],"E","Mutex (mutual exclusion): apenas uma thread por vez executa a seção crítica; as demais aguardam a liberação."],[4,"Uma thread tenta adquirir um mutex que já está em posse de outra thread. O que acontece?",["O programa gera um erro de compilação","A thread que detém o mutex é encerrada","Ela entra na seção crítica mesmo assim","Ela fica bloqueada até o mutex ser liberado","O mutex é duplicado para atender as duas"],"D","Se o mutex já está em posse de outra thread, a solicitante fica bloqueada até que ele seja liberado."],[4,"Com synchronized em Java, como ocorre a aquisição e liberação do lock?",["Manualmente, com lock() e unlock()","Não existe lock em synchronized","Pelo programador, com tryLock()","Pelo RMI Registry do servidor","Automaticamente, pela JVM"],"E","Com synchronized, a aquisição e a liberação do lock são automáticas, feitas pela JVM."],[4,"No exemplo do contador, ao aplicar synchronized em TODO o método run() (com o laço de 10 incrementos), o que acontece?",["O resultado continua inconsistente, pois o laço não é protegido","As threads entram em deadlock, pois ambas tentam pegar o mesmo lock","As threads passam a executar em paralelo real em núcleos distintos","A primeira thread faz os 10 incrementos enquanto a outra fica bloqueada","As duas threads passam a incrementar de forma alternada, uma por vez"],"D","No método sincronizado, a primeira thread executa todo o run() (os 10 incrementos) enquanto a outra fica bloqueada."],[4,"Por que o bloco sincronizado é mais recomendado que o método sincronizado no exemplo do contador?",["Porque impede que a main precise chamar join()","Porque executa tudo dentro da thread main","Porque o lock é liberado a cada incremento","Porque dispensa totalmente o uso de lock na classe","Porque é mais curto e mais fácil de escrever"],"C","O bloco sincronizado protege apenas a seção crítica; o lock é liberado a cada incremento, mantendo a concorrência."],[4,"Em qual pacote está a interface Lock, e qual é uma de suas principais implementações?",["java.rmi.server; UnicastRemoteObject","java.util.concurrent.locks; ReentrantLock","java.nio.channels; FileLock","java.util.concurrent; ExecutorService","java.lang.Thread; ThreadGroup"],"B","A interface Lock está em java.util.concurrent.locks; uma das principais implementações é ReentrantLock."],[4,"Qual é a principal diferença entre usar a interface Lock e usar synchronized?",["Não há diferença: Lock é apenas um apelido para synchronized","A interface Lock não garante exclusão mútua, apenas prioridade","Com Lock, aquisição e liberação são explícitas","Com Lock tudo é automático; com synchronized o controle é manual","O synchronized só funciona em métodos estáticos, nunca em blocos"],"C","Com Lock, o programador decide explicitamente quando entrar (lock) e sair (unlock) da seção crítica; synchronized é automático pela JVM."],[4,"Qual método da interface Lock tenta adquirir o lock sem aguardar indefinidamente, retornando false se ele estiver ocupado?",["lock()","tryLock()","lockInterruptibly()","unlock()","newCondition()"],"B","tryLock() tenta adquirir; se ocupado, retorna false e a thread pode seguir com outras instruções."],[4,"Para que serve tryLock(5, TimeUnit.SECONDS)?",["Liberar o lock automaticamente após 5 s","Criar 5 locks para 5 threads","Esperar no máximo 5 segundos pelo lock","Manter o lock por exatamente 5 segundos","Pausar a thread por 5 segundos"],"C","tryLock(tempo, unidade) define um tempo máximo de espera para conseguir o lock."],[4,"Qual método da interface Lock permite que a thread seja interrompida enquanto aguarda a aquisição do lock?",["interrupt()","lock()","lockInterruptibly()","tryLock()","awaitTermination()"],"C","lockInterruptibly() permite interromper a thread enquanto ela aguarda o lock. lock() aguarda até conseguir."],[4,"Uma thread foi criada com new Thread(r), mas start() ainda não foi invocado. Em qual estado ela está?",["BLOCKED","RUNNABLE","TERMINATED","NEW","WAITING"],"D","NEW: a thread foi instanciada, mas ainda não está em execução (start() não foi invocado)."],[4,"Uma thread está aguardando um monitor lock para entrar em um bloco synchronized ocupado por outra thread. Em qual estado ela está?",["BLOCKED","TIMED_WAITING","NEW","WAITING","RUNNABLE"],"A","BLOCKED: aguardando um monitor lock para entrar em um bloco ou método sincronizado (seção crítica)."],[4,"Segundo o material, o estado RUNNABLE de uma thread Java indica que ela está:",["apenas executando, nunca aguardando a CPU","instanciada, mas sem start() invocado","bloqueada à espera de um monitor lock","em execução ou pronta para executar","finalizada após o término do método run()"],"D","RUNNABLE engloba a thread em execução ou pronta (ready), aguardando o escalonador."],[4,"Qual é a diferença entre os estados WAITING e TIMED_WAITING?",["São equivalentes: apenas nomes diferentes para o mesmo estado da thread","WAITING espera sem limite de tempo; TIMED_WAITING tem um tempo limite","TIMED_WAITING espera indefinidamente; WAITING tem um tempo limite","WAITING aguarda um monitor lock; TIMED_WAITING aguarda uma operação de E/S","WAITING é o estado da thread finalizada; TIMED_WAITING, da thread nova"],"B","WAITING: espera indefinida por ação de outra thread. TIMED_WAITING: espera com tempo limite; se a ação não ocorrer, retorna a RUNNABLE."],[4,"Quando uma thread entra no estado TERMINATED?",["Quando chama join() em outra thread","Quando o seu quantum de CPU termina","Quando fica aguardando um monitor lock","Quando é instanciada com new Thread()","Quando run() termina"],"E","TERMINATED: a thread concluiu sua execução, normalmente (fim de run()) ou de forma abrupta."],[4,"O que é um deadlock (impasse)?",["Encerramento abrupto de uma thread por uma exceção não tratada","Resultado incorreto que depende da ordem de execução das threads","Uso de um quantum muito curto, causando chaveamentos excessivos","Várias threads lendo o mesmo dado ao mesmo tempo sem alterá-lo","Espera circular: cada thread aguarda um recurso retido por outra"],"E","Deadlock é a espera circular: cada thread aguarda um recurso mantido por outra; nenhuma prossegue."],[4,"Qual é a consequência de um deadlock?",["Liberação automática de todos os locks pela JVM","Perda de um incremento em um contador compartilhado","As threads envolvidas param de prosseguir","Aumento do speedup previsto pela Lei de Amdahl","Execução mais rápida da seção crítica protegida"],"C","No deadlock, nenhuma thread envolvida prossegue, e o sistema ou parte dele pode deixar de responder."],[4,"No jantar dos filósofos, em que situação ocorre o deadlock?",["Quando um filósofo devolve os dois garfos após terminar de comer","Quando apenas um dos filósofos está com fome em um dado momento","Quando há mais garfos disponíveis à mesa do que filósofos","Quando todos pegam o garfo da esquerda e esperam o da direita","Quando um filósofo come duas vezes seguidas, sem pensar entre elas"],"D","Se todos pegam o garfo da esquerda ao mesmo tempo, cada um espera o da direita (com o vizinho): ninguém come e ninguém libera — espera circular."],[4,"Duas threads incrementam um contador compartilhado e o resultado final às vezes é menor que o esperado; o programa, porém, sempre termina. Qual problema é esse?",["Preempção","Race condition","Deadlock","Inanição (starvation)","Ponto único de falha"],"B","Resultado inconsistente dependente da ordem de execução, sem travamento, é race condition. No deadlock, as threads ficariam travadas."]];
const EASY=new Set([59,107,244,221,80,57,121,19,153,120,184,23,109,116,219,164,149,232,105,240,201,186,198,229,214,189,131,245,92,16,27,101,73,191,18,157,217,11,161,54,168,230,140,89,25,84,85,55,39,26]);
const SETS=[['all','Todas as questões ('+RAW.length+')'],['easy','50 mais fáceis']];
const L='ABCDE';
const counter={};
const QUESTIONS=RAW.map((r,i)=>{counter[r[0]]=(counter[r[0]]||0)+1;return{id:i+1,t:r[0],topic:TOPICS[r[0]],number:counter[r[0]],question:r[1],options:r[2],answer:r[3],explanation:r[4]}});
const root=document.querySelector('#app');
const KEY='sd-study-v1';
let pool=[],answers={},idx=0,mode='',done=false,pendingFinish=false,cfg={mode:'Estudar',set:'all',src:-1,amount:0,shuffle:true};
let p={answered:0,correct:0,wrong:[],history:[],last:{}};
try{Object.assign(p,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
if(!p.last)p.last={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}}
const ok=(q,a)=>Number.isInteger(a)&&L[a]===q.answer;
function record(q,a){p.answered++;const good=ok(q,a);p.last[q.id]=good?1:0;if(good){p.correct++;p.wrong=p.wrong.filter(x=>x!==q.id)}else if(!p.wrong.includes(q.id))p.wrong.push(q.id);save()}
function opt(v,label,sel){return `<option value="${v}" ${String(sel)===String(v)?'selected':''}>${esc(label)}</option>`}

function home(msg){
  const topicOpts=opt(-1,'Todos os temas',cfg.src)+TOPICS.map((t,i)=>opt(i,`${t} (${QUESTIONS.filter(q=>q.t===i).length})`,cfg.src)).join('');
  root.innerHTML=`<h2>Como você quer estudar?</h2><p>${QUESTIONS.length} questões • ${TOPICS.length} temas. Todas sempre disponíveis.</p>
  ${msg?`<div class="notice" role="status">${esc(msg)}</div>`:''}
  <label class="field">Modo<select id="mode">${['Estudar','Simulado','Revisar erros'].map(m=>opt(m,m,cfg.mode)).join('')}</select></label>
  <label class="field">Questões<select id="set">${SETS.map(([v,l])=>opt(v,l,cfg.set)).join('')}</select></label>
  <label class="field">Tema<select id="source">${topicOpts}</select></label>
  <label class="field">Quantidade<select id="amount">${opt(0,'Todas',cfg.amount)}${[10,20,30,50].map(n=>opt(n,n,cfg.amount)).join('')}</select></label>
  <label><input type="checkbox" id="shuffle" ${cfg.shuffle?'checked':''}> Embaralhar questões</label>
  <div class="actions"><button class="primary" id="go">Iniciar estudo →</button></div>
  <p>Estudar: correção imediata. Simulado: correção no final. Revisar erros: treine as questões que você errou (${p.wrong.length} no momento).</p>`;
  document.querySelector('#go').onclick=()=>{cfg={mode:document.querySelector('#mode').value,set:document.querySelector('#set').value,src:Number(document.querySelector('#source').value),amount:Number(document.querySelector('#amount').value),shuffle:document.querySelector('#shuffle').checked};start(false)};
}
function start(review){
  mode=review?'Revisar erros':cfg.mode;
  const src=review?-1:cfg.src,n=review?0:cfg.amount;
  pool=QUESTIONS.filter(q=>(review||cfg.set!=='easy'||EASY.has(q.id))&&(src<0||q.t===src)&&(mode!=='Revisar erros'||p.wrong.includes(q.id)));
  if(!pool.length){home(mode==='Revisar erros'?'Nenhum erro para revisar'+(src<0&&cfg.set==='all'?'.':' nesta seleção.')+' Faça uma rodada de Estudar ou Simulado primeiro.':'Nenhuma questão encontrada.');return}
  if(review||cfg.shuffle)for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  if(n)pool=pool.slice(0,n);
  answers={};idx=0;done=false;pendingFinish=false;render();
}
function render(){
  const q=pool[idx],a=answers[q.id],reveal=mode!=='Simulado'&&a!==undefined,answered=Object.keys(answers).length;
  root.innerHTML=`<p class="muted">${esc(mode)} • QUESTÃO ${idx+1}/${pool.length} • ${esc(q.topic.toUpperCase())} / Nº ${q.number}</p>
  <div class="bar" aria-hidden="true"><i style="width:${Math.round(100*answered/pool.length)}%"></i></div>
  <p class="tag">${esc(q.topic)}${EASY.has(q.id)?' · fácil':''}</p>
  <h2>${esc(q.question)}</h2>
  ${q.options.map((o,i)=>{let cls='';if(reveal){if(L[i]===q.answer)cls='ok';else if(a===i)cls='bad';cls+=' locked'}
    return `<label class="${cls}"><input type="radio" name="choice" value="${i}" ${a===i?'checked':''} ${reveal?'disabled':''}> ${L[i]}) ${esc(o)}</label>`}).join('')}
  ${reveal?`<p class="verdict ${ok(q,a)?'ok':'bad'}">${ok(q,a)?'✓ Correto':'✕ Incorreto'}</p><p>Gabarito: ${q.answer}</p><pre>${esc(q.explanation)}</pre>`
    :`<p>A correção ${mode==='Simulado'?'aparece ao finalizar. Você pode voltar e alterar respostas.':'aparece depois que você marcar uma alternativa.'}</p>`}
  ${pendingFinish?`<div class="notice" role="alert">Faltam ${pool.filter(x=>answers[x.id]===undefined).length} respostas. Clique em “Finalizar mesmo assim” para encerrar.</div>`:''}
  <div class="actions"><button id="prev" ${idx===0?'disabled':''}>← Anterior</button>
  <button class="primary" id="next" ${mode!=='Simulado'&&a===undefined?'disabled':''}>${idx===pool.length-1?(pendingFinish?'Finalizar mesmo assim':'Finalizar'):'Próxima →'}</button>
  ${mode==='Simulado'&&idx<pool.length-1?'<button class="ghost" id="end">Finalizar simulado</button>':''}</div>
  <p class="kbd">Atalhos: teclas A–E ou 1–5 para marcar, ← e → para navegar.</p>`;
  root.querySelectorAll('input[name=choice]').forEach(r=>r.onchange=()=>choose(Number(r.value)));
  root.querySelector('#prev').onclick=()=>move(-1);
  root.querySelector('#next').onclick=()=>move(1);
  const e=root.querySelector('#end');if(e)e.onclick=()=>tryFinish();
}
function choose(a){const q=pool[idx];if(mode!=='Simulado'&&answers[q.id]!==undefined)return;answers[q.id]=a;pendingFinish=false;if(mode!=='Simulado')record(q,a);render()}
function tryFinish(){const missing=pool.filter(q=>answers[q.id]===undefined).length;if(missing&&!pendingFinish){pendingFinish=true;idx=pool.length-1;render();return}result()}
function move(d){
  if(d<0){if(idx>0){idx--;pendingFinish=false;render()}return}
  if(mode!=='Simulado'&&answers[pool[idx].id]===undefined)return;
  if(idx<pool.length-1){idx++;render();window.scrollTo({top:root.offsetTop-20})}else tryFinish();
}
function result(){
  if(done)return;done=true;
  if(mode==='Simulado')pool.forEach(q=>{if(answers[q.id]!==undefined)record(q,answers[q.id]);else if(!p.wrong.includes(q.id))p.wrong.push(q.id)});
  const score=pool.filter(q=>ok(q,answers[q.id])).length;
  p.history.push({date:new Date().toLocaleString('pt-BR'),score,total:pool.length,mode});p.history=p.history.slice(-50);save();
  const byT={};pool.forEach(q=>{byT[q.t]=byT[q.t]||[0,0];byT[q.t][1]++;if(ok(q,answers[q.id]))byT[q.t][0]++});
  root.innerHTML=`<h2>${score}/${pool.length} acertos • Nota ${(score/pool.length*10).toFixed(1)}/10</h2>
  <table><thead><tr><th>Tema</th><th class="n">Acertos</th></tr></thead><tbody>${Object.keys(byT).map(t=>`<tr><td>${esc(TOPICS[t])}</td><td class="n">${byT[t][0]}/${byT[t][1]}</td></tr>`).join('')}</tbody></table>
  <div class="actions"><button class="primary" id="again">Novo estudo</button><button id="rev">Revisar meus erros</button></div>
  <h3>Correção completa</h3>${pool.map(q=>{const a=answers[q.id];return `<details><summary>${ok(q,a)?'✅':'❌'} ${esc(q.topic)} · ${q.number}. ${esc(q.question)}</summary><p>Sua resposta: ${a===undefined?'Não respondida':L[a]+') '+esc(q.options[a])}</p><p>Correta: ${q.answer}) ${esc(q.options[L.indexOf(q.answer)])}</p><pre>${esc(q.explanation)}</pre></details>`}).join('')}`;
  root.querySelector('#again').onclick=()=>home();root.querySelector('#rev').onclick=()=>start(true);
  window.scrollTo({top:0});
}
function stats(confirmReset){
  pool=[];
  const rows=TOPICS.map((t,i)=>{const qs=QUESTIONS.filter(q=>q.t===i),seen=qs.filter(q=>p.last[q.id]!==undefined),good=seen.filter(q=>p.last[q.id]===1).length,wr=qs.filter(q=>p.wrong.includes(q.id)).length;
    return `<tr><td>${esc(t)}</td><td class="n">${seen.length}/${qs.length}</td><td class="n">${seen.length?Math.round(100*good/seen.length)+'%':'–'}</td><td class="n">${wr}</td></tr>`}).join('');
  root.innerHTML=`<h2>Meu desempenho</h2><p>${p.answered} respostas • ${p.answered?Math.round(100*p.correct/p.answered):0}% de acerto • ${p.wrong.length} para revisar</p>
  <div class="actions"><button class="primary" id="rev">Revisar erros</button></div>
  <h3>Por tema</h3><table><thead><tr><th>Tema</th><th class="n">Vistas</th><th class="n">Acerto</th><th class="n">Erros</th></tr></thead><tbody>${rows}</tbody></table>
  <h3>Últimas sessões</h3>${p.history.slice(-15).reverse().map(h=>`<p>${esc(h.date)} • ${esc(h.mode)} • ${h.score}/${h.total}</p>`).join('')||'<p>Nenhuma sessão concluída.</p>'}
  ${confirmReset?'<div class="notice" role="alert">Isso apaga todo o progresso salvo neste navegador.</div>':''}
  <div class="actions"><button class="ghost" id="reset">${confirmReset?'Confirmar: apagar progresso':'Zerar progresso'}</button></div>`;
  root.querySelector('#rev').onclick=()=>start(true);
  root.querySelector('#reset').onclick=()=>{if(!confirmReset){stats(true);return}p={answered:0,correct:0,wrong:[],history:[],last:{}};save();stats(false)};
}
document.querySelector('#nav-home').onclick=()=>{pool=[];home()};
document.querySelector('#nav-stats').onclick=()=>stats(false);
document.addEventListener('keydown',e=>{
  if(!pool.length||done||e.target.tagName==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toUpperCase();let i=L.indexOf(k);if(i<0&&/^[1-5]$/.test(e.key))i=Number(e.key)-1;
  if(i>=0&&k.length===1){choose(i);return}
  if(e.key==='ArrowRight'){const b=root.querySelector('#next');if(b&&!b.disabled)move(1)}
  else if(e.key==='ArrowLeft')move(-1);
});
home();
}
</script>
</body></html>
