enho","Simplicidade para o usuário, com a complexidade gerenciada pelo sistema"],"E","A transparência oculta a natureza distribuída do sistema. O objetivo citado é: simplicidade para o usuário, complexidade gerenciada pelo sistema."],[0,"Quais são as três dimensões da escalabilidade apresentadas no material?",["Lógica, física e temporal","Tamanho, geográfica e administrativa","Interoperabilidade, extensibilidade e flexibilidade","Disponibilidade, segurança e recuperabilidade","Vertical, horizontal e diagonal"],"B","Escalabilidade: crescer sem degradação significativa em tamanho (mais usuários/recursos), geográfica (grandes distâncias) e administrativa (múltiplas organizações independentes)."],[0,"Um sistema precisa passar a abranger várias organizações independentes, cada uma com suas próprias políticas, sem perder desempenho. Qual dimensão de escalabilidade está envolvida?",["Geográfica","De tamanho","Administrativa","Temporal","Vertical"],"C","A escalabilidade administrativa trata de abranger múltiplas organizações independentes."],[0,"Um serviço precisa funcionar eficientemente para usuários espalhados em continentes diferentes. Qual dimensão de escalabilidade está em foco?",["Administrativa","Abertura","Recuperabilidade","Geográfica","De tamanho"],"D","A escalabilidade geográfica é a capacidade de funcionar eficientemente em grandes distâncias."],[0,"Quais desafios são citados para a escalabilidade de um SD?",["Condição de corrida, deadlock e proteção da seção crítica","Amarração a fornecedor, falta de padrões e incompatibilidade de hardware","Latência de rede, sincronização e heterogeneidade administrativa","Atomicidade, consistência e durabilidade das transações","Ponto único de falha, gargalo e alto custo de supercomputadores"],"C","O slide de escalabilidade lista como desafios: latência de rede, sincronização e heterogeneidade administrativa."],[0,"A analogia do hub USB (aceita diferentes dispositivos, mas com o mesmo padrão de comunicação) ilustra qual cara lidade, Segurança é a proteção contra falhas catastróficas; disponibilidade é permanecer utilizável."],[0,"Qual dos itens abaixo NÃO é um aspecto da Confiabilidade listado no material?",["Tolerância a falhas","Disponibilidade","Recuperabilidade","Interoperabilidade","Segurança"],"D","Interoperabilidade é um aspecto da Abertura. Os aspectos de Confiabilidade são disponibilidade, segurança, tolerância a falhas e recuperabilidade."],[0,"Os servidores NTP são citados no material em relação a qual desafio da Concorrência?",["Compartilhamento seguro de recursos","Controle de acesso concorrente aos dados","Ausência de relógio global para sincronização","Heterogeneidade administrativa entre organizações","Latência causada pela distância geográfica"],"C","Em SDs não existe um relógio global; servidores NTP são usados para sincronizar os relógios das máquinas."],[0,"Qual benefício é atribuído à característica Concorrência?",["Evitar amarração a fornecedores","Eliminação do ponto único de falha","Melhor uso de recursos e tempo de resposta","Integração com sistemas de terceiros","Simplicidade de uso para o usuário"],"C","A concorrência permite que múltiplos processos executem simultaneamente, trazendo melhor utilização de recursos e tempo de resposta."],[0,"Qual dos itens NÃO é listado como desafio da Concorrência?",["Amarração a uma única tecnologia","Compartilhamento seguro de recursos","Controle de acesso concorrente","Coordenação entre processos distribuídos","Ausência de relógio global"],"A","Amarração a uma tecnologia é o problema que a Abertura resolve. Os demais são desafios da concorrência."],[0,"No cenário prático do serviço de streaming, “se um servidor cai, outro assume automaticamente” exemplifica:",["Concorrência","Abertura","Confiabilidade","Escalabilidade","Transparência"],"C","No exemplo do streaming, a troca automática de servidor em caso de falha ilustra a Confiabilidade."],[0,"No cenário do serviço de streaming, “integra sistema de terceiros para processar assinaturas” exemplifica:",["Transparência","Concorrência","Escalabilidade administrativa","Confiabilidade","Abertura"],"E","Integrar sistemas de terceiros através de padrões é Abertura."],[0,"No cenário do serviço de streaming, “o usuário não sabe em qual servidor está o filme” exemplifica:",["Recuperabilidade","Abertura","Transparência","Concorrência","Escalabilidade"],"C","Ocultar a localização do recurso, escondendo a natureza distribuída, é Transparência."],[0,"No cenário do streaming, qual característica é exemplificada por “milhões assistindo simultaneamente”, segundo o material?",["Abertura","Escalabilidade","Transparência","Concorrência","Confiabilidade"],"B","O slide associa “milhões assistindo simultaneamente” à Escalabilidade; “múltiplas requisições processadas juntas” é que foi associado à Concorrência."],[0,"Quais são, respectivamente, as vantagens e as desvantagens dos SDs apresentadas no material?",["Segurança e simplicidade; escalabilidade e abertura","Transparência e concorrência; latência e heterogeneidade","Centralização e controle; ponto único de falha e gargalo","Eficiência e disponibilidade; complexidade e segurança","Simplicidade e baixo custo; lentidão e baixa disponibilidade"],"D","Vantagens: eficiência e disponibilidade. Desvantagens: complexidade (configurar e gerenciar a comunicação) e segurança."],[0,"Por que a segurança é apontada como desvantagem dos SDs?",["Porque a transparência impede a autenticação dos usuários","Porque todo SD possui obrigatoriamente um ponto único de falha","Porque os protocolos de SDs não permitem o uso de criptografia","Porque a interação entre vários sistemas amplia a superfície de ataque","Porque os dados ficam sempre concentrados em um único servidor"],"D","A interação entre múltiplos sistemas aumenta a superfície de ataque, sendo um desafio significativo e constante."],[0,"Segundo a vantagem de disponibilidade, por que a arquitetura distribuída é mais disponível?",["Porque elimina completamente a dependência da rede de comunicação","Porque a falha de um componente não compromete o sistema todo","Porque o middleware impede que ocorram falhas de hardware","Porque concentra tudo em um único servidor mais potente e confiável","Porque os componentes executam a mesma tarefa em sequência"],"B","A disponibilidade vem do fato de que a falha de um componente não compromete o sistema todo; os demais continuam operando."],[0,"Onde se posiciona o middleware em um sistema distribuído?",["Apenas no servidor central, nunca nas máquinas clientes","Entre as aplicações do usuário e o sistema operacional","Dentro do kernel, substituindo os drivers de rede de cada máquina","Abaixo do sistema operacional, controlando diretamente o hardware","Na camada física da rede, junto aos cabos e roteadores"],"B","O middleware (intermediário) fica entre as aplicações do usuário e o sistema operacional, gerenciando a comunicação entre componentes."],[0,"Qual das afirmações sobre o middleware está INCORRETA?",["Gerencia a comunicação entre componentes","Oculta a complexidade da distribuição","Substitui o SO local de cada máquina","Oferece uma “visão única de sistema”","Permite que computadores diferentes cooperem"],"C","O middleware não substitui o SO: ele fica entre as aplicações e o sistema operacional de cada máquina."],[0,"Sobre a World Wide Web como exemplo de SD, é correto afirmar que:",["exige que o usuário saiba em qual servidor está cada documento","segue o modelo cliente-servidor e dá acesso transparente aos recursos","é um exemplo de computação em cluster com máquinas homogêneas","é baseada no modelo peer-to-peer puro, sem servidores dedicados","deixa de funcionar sempre que qualquer parte da rede apresenta falha"],"B","A Web é baseada no modelo cliente-servidor, oferece acesso transparente a documentos e serviços e mantém disponibilidade mesmo com falhas em partes da rede."],[0,"A característica que permite que os usuários interajam com o SD como se fosse um sistema centralizado único é:",["Descentralização","Abertura","Transparência","Escalabilidade","Concorrência"],"C","A transparência faz o sistema esconder sua natureza distribuída, parecendo um sistema centralizado único."],[1,"Quais são as três categorias principais de Sistemas Distribuídos apresentadas?",["Sistemas Domésticos, de Saúde Eletrônicos e Redes de Sensores","Computação Distribuída, Informação Distribuída e Pervasivos","Computação em Cluster, Computação em Grade e Computação em Nuvem","Centralizados, Descentralizados e Híbridos","Em camadas, baseados em objetos e orientados a eventos"],"B","Os SDs são classificados em: Computação Distribuída, Informação Distribuída e Pervasivos. Domésticos/Saúde/Sensores são subtipos dos pervasivos."],[1,"Qual é o foco principal dos Sistemas de Computação Distribuídos?",["Integrar aplicações empresariais isoladas por meio de middleware especializado","Maximizar a eficiência do processamento com vários computadores em paralelo","Garantir as propriedades ACID em transações que envolvem vários bancos","Conectar dispositivos móveis alimentados por bateria e sem administração central","Permitir comunicação assíncrona entre aplicações por publish/subscribe"],"B","Sistemas de Computação Distribuídos são projetados para maximizar a eficiência do processamento, com vários computadores trabalhando simultaneamente em tarefas complexas."],[1,"Qual dos itens NÃO é uma característica dos Sistemas de Computação Distribuídos listada no material?",["Escalabilidade pela adição de novos nós","Alto desempenho computacional","Tolerância a falhas isoladas","Desacoplamento temporal entre aplicações","Custo-benefício frente a supercomputadores"],"D","Desacoplamento temporal é uma vantagem do MOM (Sistemas de Informação). As demais são características dos sistemas de computação distribuídos."],[1,"Os Sistemas de Computação Distribuídos dividem-se em quais subcategorias?",["Computação de Cluster e Computação em Grade","Chamada de procedimento (RPC) e de método (RMI)","Hub central e Conexão contínua","Processamento de Transações e EAI","Abordagem centralizada e abordagem distribuída"],"A","As duas subcategorias são Computação de Cluster e Computação em Grade (Grid)."],[1,"Qual descrição corresponde à Computação de Cluster?",["Sensores sem fio de baixo consumo funcionando como bancos de dados distribuídos","Dispositivos móveis com conexão sem fio, autônomos e sem administração central","Máquinas homogêneas, em rede local rápida, executando o mesmo SO","Computadores heterogêneos de várias instituições, distribuídos geograficamente","Aplicações empresariais que trocam mensagens assíncronas por meio de tópicos"],"C","Cluster: computadores homogêneos, rede local de alta velocidade e mesmo SO. Grid é heterogêneo e geograficamente distribuído."],[1,"Na Computação em Grade (Grid), a heterogeneidade dos computadores envolve:",["apenas o hardware, já que o sistema operacional precisa ser o mesmo em todos os nós","somente as aplicações finais, já que a infraestrutura é sempre homogênea","hardware, SO, redes, domínios administrativos e políticas de segurança","apenas a velocidade da rede local que interliga as máquinas do laboratório","somente a localização geográfica, pois hardware e software são padronizados"],"C","O Grid é composto por computadores heterogêneos em hardware, SO, redes, domínios administrativos e políticas de segurança."],[1,"Um laboratório interliga 32 PCs idênticos, com Linux, em uma rede local rápida para executar programas paralelos intensivos em computação. Trata-se de:",["Computação de Cluster","Sistema de informação distribuído","Sistema pervasivo doméstico","Rede de sensores distribuída","Computação em Grade"],"A","Máquinas homogêneas, mesmo SO e rede local de alta velocidade caracterizam um cluster."],[1,"Universidades de vários países compartilham seus recursos computacionais, com SOs, redes e políticas de segurança diferentes, para um projeto científico conjunto. Trata-se de:",["Monitor de transações (TP)","Computação em Grade (Grid)","Sistema de saúde eletrônico","Arquitetura centralizada","Computação de Cluster Beowulf"],"B","Recursos heterogêneos, geograficamente distribuídos e de múltiplas instituições caracterizam a computação em grade."],[1,"Por que os clusters representam uma alternativa de baixo custo aos supercomputadores?",["Porque não precisam de nenhuma rede local","Porque usam apenas um nó de computação","Porque usam recursos de várias instituições","Porque utilizam hardware comum “de prateleira”","Porque dispensam o uso de sistema operacional"],"D","Clusters usam hardware comum de prateleira, sendo uma alternativa barata aos supercomputadores tradicionais."],[1,"Em um cluster Beowulf, qual é o papel do nó mestre?",["Gerenciar a fila de jobs, alocar nós e servir de interface aos usuários","Traduzir chamadas locais em requisições de rede, como um proxy do cliente","Executar sozinho todos os cálculos, enquanto os demais nós apenas armazenam dados","Descobrir e alocar recursos pertencentes a outras instituições da grade","Coletar dados de sensores ambientais e repassá-los ao operador em tempo real"],"A","No Beowulf há 1 nó mestre (gerencia a fila de jobs, aloca nós e é a interface dos usuários) e N nós de computação, que executam as tarefas."],[1,"No contexto do cluster Beowulf, a “fila de jobs” é:",["o protocolo usado na comunicação entre o nó mestre e os nós de computação","a estrutura que organiza tarefas a serem executadas de forma assíncrona","o registro de nomes dos objetos remotos disponíveis em cada nó","a lista de usuários autorizados a submeter programas ao cluster","a tabela de processos mantida pelo sistema operacional de cada nó"],"B","A fila de jobs é a estrutura de dados que armazena e organiza as tarefas a serem executadas de forma assíncrona, gerenciada pelo nó mestre."],[1,"Qual é a ordem correta das 5 camadas da arquitetura de Computação em Grade (da base ao topo)?",["Base (Fabric) → Recursos → Conectividade → Coletiva → Aplicação","Base (Fabric) → Coletiva → Conectividade → Recursos → Aplicação","Aplicação → Coletiva → Base (Fabric) → Recursos → Conectividade","Base (Fabric) → Conectividade → Recursos → Coletiva → Aplicação","Conectividade → Base (Fabric) → Coletiva → Recursos → Aplicação"],"D","As camadas são: 1. Base (Fabric), 2. Conectividade, 3. Recursos, 4. Coletiva, 5. Aplicação."],[1,"Na arquitetura em camadas do Grid, qual camada contém os protocolos de comunicação e segurança, como TCP/IP e SSL?",["Recursos (Resource)","Conectividade (Connectivity)","Coletiva (Collective)","Aplicação (Application)","Base (Fabric)"],"B","A camada de Conectividade reúne protocolos de comunicação e segurança (TCP/IP, SSL)."],[1,"Na arquitetura do Grid, um serviço local que permite iniciar um processo remotamente ou monitorar o consumo de CPU de um nó específico pertence à camada:",["de Conectividade","Base (Fabric)","de Aplicação","Coletiva","de Recursos"],"E","A camada de Recursos faz o gerenciamento de um recurso individual (iniciar processo remoto, acessar configurações, monitorar CPU de um nó)."],[1,"Na arquitetura do Grid, a descoberta de recursos e a alocação (middlewares) são responsabilidade da camada:",["de Aplicação","de Conectividade","de Recursos","Base (Fabric)","Coletiva"],"E","A camada Coletiva cuida da descoberta e alocação de recursos (middlewares), enquanto a de Recursos gerencia um recurso individual."],[1,"Na arquitetura do Grid, a camada Base (Fabric) corresponde a:",["interfaces para os recursos locais, incluindo os SOs","descoberta de recursos e alocação por middlewares","softwares finais, como os de climatologia e física","protocolos de comunicação e segurança (TCP/IP, SSL)","gerenciamento de um recurso individual de um nó"],"A","A camada Base (Fabric) fornece interfaces para os recursos locais: componentes físicos e lógicos, incluindo os sistemas operacionais."],[1,"Um software de análise de dados de aceleradores de partículas que usa o ambiente de grade pertence a qual camada?",["Base (Fabric)","Recursos","Aplicação","Coletiva","Conectividade"],"C","A camada de Aplicação reúne os softwares finais que usam o ambiente de grade (climatologia, análise de dados de aceleradores etc.)."],[1,"Sobre a WLCG (Worldwide LHC Computing Grid), é correto afirmar que:",["é uma rede de sensores do CERN para monitoramento climático e de solo no campo","é um sistema de informação do CERN baseado em transações ACID e Monitor TP","é uma plataforma de streaming de eventos que usa publish/subscribe entre laboratórios","é uma grade do CERN para os dados do LHC, com o Brasil participando pelo SPRACE","é um cluster Beowulf homogêneo instalado em um único prédio do CERN, na Suíça"],"D","A WLCG é uma grade global do CERN para os dados do LHC; o Brasil participa pelo SPRACE, na Unesp em São Paulo."],[1,"Os Sistemas de Informação Distribuídos surgiram a partir de:",["a expansão das redes e da integração empresarial","o barateamento de sensores sem fio e de baterias","a criação do acelerador de partículas LHC","a necessidade de monitoramento contínuo de saúde","a necessidade de substituir supercomputadores"],"A","Surgiram com a expansão das redes e a necessidade de integração empresarial, passando de aplicações isoladas à comunicação entre sistemas."],[1,"Quais são as duas linhas principais dos Sistemas de Informação Distribuídos?",["Hub central e Conexão contínua","Publicação e Assinatura (Publish/Subscribe)","Computação de Cluster e Computação em Grade","Stub (cliente) e Skeleton (servidor)","Processamento de Transações e EAI"],"E","As duas linhas são o Processamento de Transações e a Integração de Aplicações Empresariais (EAI)."],[1,"Em uma transferência bancária, o débito foi realizado mas o crédito falhou; por isso toda a operação é desfeita. Qual propriedade ACID garante isso?",["Atomicidade","Durabilidade","Isolamento","Disponibilidade","Consistência"],"A","Atomicidade = tudo ou nada: a transação é uma unidade indivisível; ou todas as operações ocorrem, ou nenhuma."],[1,"Na sigla ACID, a propriedade descrita como “concorrência sem interferência” é:",["Atomicidade","Isolamento","Disponibilidade","Durabilidade","Consistência"],"B","Isolamento: transações concorrentes não interferem umas nas outras."],[1,"Após a confirmação de uma transação, o servidor sofre uma queda de energia, mas os dados gravados permanecem. Qual propriedade ACID está sendo garantida?",["Consistência","Recuperabilidade","Isolamento","Durabilidade","Atomicidade"],"D","Durabilidade: permanência dos dados mesmo após falhas."],[1,"Na sigla ACID, a Consistência significa:",["replicação dos dados em todos os nós","permanência após falhas","preservar as regras do sistema","concorrência sem interferência","tudo ou nada"],"C","Consistência: a transação preserva as regras (restrições) do sistema."],[1,"O que caracteriza as Transações Aninhadas?",["Transações executadas sempre sequencialmente em um único servidor de banco","Chamadas de procedimento executadas em máquinas remotas como se fossem locais","Uma transação dividida em subtarefas hierárquicas, paralelizáveis e ainda ACID","Transações que abrem mão das propriedades ACID para ganhar desempenho em paralelo","Mensagens publicadas em tópicos e entregues aos assinantes pelo middleware"],"C","Transações aninhadas organizam uma transação maior em subtarefas (hierarquia) que podem rodar em paralelo, ainda mantendo ACID."],[1,"Qual é a função do Monitor TP (Transaction Processing Monitor)?",["Entregar as mensagens publicadas em tópicos a todos os assinantes interessados","Escalonar os processos do sistema operacional de acordo com a prioridade","Coordenar transações, garantindo ACID mesmo entre vários servidores ou bancos","Monitorar o consumo de CPU e memória de cada nó de computação do cluster","Registrar objetos remotos por nome para que os clientes possam localizá-los"],"C","O Monitor TP gerencia e coordena transações em ambientes distribuídos, garantindo ACID mesmo com múltiplos servidores ou bancos."],[1,"Qual é a diferença de foco entre a EAI e o Processamento de Transações?",["A EAI foca na manipulação de dados em bancos; as transações focam na troca entre aplicações","A EAI é usada somente em clusters, e as transações somente em grades computacionais","Não há diferença de foco; os dois termos são sinônimos no contexto empresarial","A EAI foca na comunicação entre as aplicações, indo além da manipulação de dados","A EAI dispensa middleware, enquanto as transações dependem de um Monitor TP"],"D","O processamento de transações foca em bancos de dados (ACID); a EAI foca na comunicação direta e flexível entre componentes de aplicações diferentes, via middleware."],[1,"Qual protocolo de EAI permite que um programa chame uma função em outra máquina como se fosse uma chamada local, sem foco em orientação a objetos?",["RMI","JRMP","RPC","NTP","MOM"],"C","RPC (Remote Procedure Call) chama procedimentos/funções remotos como se fossem locais. O RMI é a evolução orientada a objetos do RPC."],[1,"Como o RMI se relaciona com o RPC, segundo o material de Tipos de SDs?",["O RMI é um tipo de MOM baseado em publish/subscribe","O RPC é a versão orientada a objetos do RMI","O RMI é uma evolução do RPC voltada à orientação a objetos","Não há relação entre eles; são abordagens independentes","O RMI é assíncrono, enquanto o RPC é sempre síncrono"],"C","RMI é uma evolução do RPC, permitindo que um objeto em uma máquina chame métodos de um objeto em outra máquina."],[1,"Qual vantagem do MOM (Message-Oriented Middleware) é chamada de desacoplamento temporal?",["As aplicações não precisam estar ativas ao mesmo tempo para se comunicar","A comunicação inicial usa sempre a porta 1099 e depois uma porta aleatória","Os relógios das máquinas são sincronizados por servidores NTP","As mensagens são sempre entregues na mesma ordem em que foram publicadas","O cliente fica bloqueado até a resposta do servidor chegar pela rede"],"A","O MOM usa comunicação assíncrona por mensagens; as aplicações não precisam estar ativas ao mesmo tempo — isso é o desacoplamento temporal."],[1,"No modelo Publish/Subscribe usado pelo MOM:",["o assinante precisa estar ativo exatamente no momento da publicação da mensagem","o publicador envia cada mensagem diretamente ao endereço de cada um dos assinantes","o servidor registra objetos remotos por nome para que os clientes façam lookup","cada mensagem é entregue a apenas um assinante, escolhido pelo próprio publicador","publicadores enviam a tópicos, e o middleware entrega a quem se inscreveu neles"],"E","No publish/subscribe, publicadores enviam para tópicos e o middleware entrega aos inscritos, eliminando a conexão direta e em tempo real."],[1,"Qual alternativa descreve os Sistemas Distribuídos Pervasivos?",["Servidores de banco de dados coordenados por um Monitor TP com controle ACID","Supercomputadores dedicados a simulações e cálculos científicos de larga escala","Dispositivos móveis, pequenos, à bateria, sem fio e sem administração central","Aplicações empresariais integradas por RPC, RMI e middleware orientado a mensagens","Computadores homogêneos interligados por rede local de alta velocidade e mesmo SO"],"C","Os pervasivos são compostos por dispositivos móveis, pequenos, à bateria, sem fio e limitados, presentes no cotidiano, autônomos e sem administração central."],[1,"O que diferencia os SDs pervasivos dos sistemas tradicionais quanto à estabilidade?",["Os tradicionais são instáveis por natureza, enquanto os pervasivos são estáveis","Os pervasivos garantem transparência total de distribuição, mesmo instáveis","Nos pervasivos a instabilidade é natural; os tradicionais focam em conexões fixas","Os pervasivos exigem conexões fixas e estáveis, ao contrário dos tradicionais","Ambos dependem de administração central para garantir a estabilidade da rede"],"C","Os sistemas tradicionais seguem o paradigma de estabilidade e conexões fixas; nos pervasivos, a instabilidade é natural."],[1,"Nos SDs pervasivos, o requisito que envolve “fácil configuração, adaptação a diferentes usuários e instalação dinâmica” é:",["Composição ad hoc","Adaptação ao contexto","Compartilhamento como padrão","Escalabilidade administrativa","Transparência de distribuição"],"A","Composição ad hoc: fácil configuração, adaptação a diferentes usuários e instalação dinâmica."],[1,"Um dispositivo pervasivo precisa reagir a mudanças ambientais e a redes dinâmicas. Qual requisito é esse?",["Adaptação ao contexto","Composição ad hoc","Abertura","Recuperabilidade","Compartilhamento como padrão"],"A","Adaptação ao contexto: reagir a mudanças ambientais e a redes dinâmicas."],[1,"O requisito “Compartilhamento como padrão”, nos SDs pervasivos, significa:",["acessar e fornecer dados mesmo com conectividade intermitente","ocultar totalmente a distribuição dos dispositivos do usuário","compartilhar a memória do processo entre as threads do app","manter todos os dados em um único servidor central confiável","exigir que todos os dispositivos da rede sejam homogêneos"],"A","Compartilhamento como padrão: acessar e fornecer dados mesmo com conectividade intermitente."],[1,"Sobre a transparência de distribuição nos SDs pervasivos, o material afirma que:",["ela é garantida pelo middleware","ela é obrigatória e deve ser total","ela existe apenas nos sistemas domésticos","ela não é possível; a distribuição é exposta","ela é obtida por meio de um hub central"],"D","Nos pervasivos, a transparência de distribuição não é possível: a distribuição deve ser exposta."],[1,"Quais são os principais tipos de SDs pervasivos apresentados?",["Transações, EAI e middleware orientado a mensagens","Domésticos, de saúde eletrônicos e redes de sensores","Computação de Cluster, Grade e Nuvem","Centralizados, descentralizados e híbridos","Chamadas RPC, RMI e mensagens MOM"],"B","Os principais tipos pervasivos são: domésticos, de saúde eletrônicos e redes de sensores."],[1,"Qual dos itens NÃO é citado como desafio dos sistemas domésticos?",["Gerenciamento de espaços pessoais","Autogerenciamento","Autoconfiguração completa","Atualizações automáticas","Garantia de ACID entre bancos"],"E","ACID é tema de processamento de transações. Os desafios domésticos são autoconfiguração, autogerenciamento, atualizações automáticas e gerenciamento de espaços pessoais."],[1,"Por que os sistemas recomendadores se adaptam bem a dispositivos móveis?",["Porque não analisam o comportamento nem as preferências","Porque exigem processamento de baixo custo computacional","Porque precisam de conexão contínua com um hub central","Porque dependem do poder de supercomputadores remotos","Porque executam apenas transações ACID simples e rápidas"],"B","Os recomendadores exigem processamento de baixo custo computacional, o que os torna adequados a dispositivos móveis."],[1,"Que problema os sistemas recomendadores surgiram para resolver?",["O excesso de conteúdo disponível para o usuário","A falta de segurança nas redes sem fio domésticas","A falta de conectividade dos dispositivos domésticos","A ausência de um relógio global entre os aparelhos","O alto custo dos supercomputadores científicos"],"A","Surgiram para lidar com o excesso de conteúdo, analisando preferências e comportamento do usuário para sugerir itens relevantes."],[1,"Nos sistemas de saúde eletrônicos, o que são as BANs?",["Bancos de dados hospitalares com controle transacional ACID","Clusters Beowulf dedicados à análise de exames médicos","Bibliotecas de execução paralela para dados clínicos","Barramentos de eventos publish/subscribe entre hospitais","Redes de sensores sem fio leves dispostos no corpo do usuário"],"E","BAN = Body Area Network (Rede de Área Corporal), formada por sensores sem fio leves e móveis no corpo do usuário."],[1,"Nos sistemas de saúde eletrônicos, qual é a diferença entre as abordagens Hub central e Conexão contínua?",["Ambas eliminam a necessidade de sensores no corpo do paciente monitorado","O hub central é usado só em redes de sensores ambientais, não em saúde","O hub transmite em tempo real; a conexão contínua armazena periodicamente","A conexão contínua dispensa qualquer rede externa para enviar os dados","O hub armazena periodicamente; a conexão contínua transmite em tempo real"],"E","Hub central: coleta e armazena periodicamente. Conexão contínua: transmissão em tempo real para redes externas."],[1,"Qual dos itens NÃO é listado como desafio dos sistemas de saúde eletrônicos?",["Armazenamento seguro","Forte política de privacidade","Transmissão confiável","Fila de jobs do nó mestre","Alertas de emergência"],"D","Fila de jobs pertence ao cluster Beowulf. Os desafios de saúde incluem armazenamento seguro, transmissão confiável, alertas, feedback médico e privacidade."],[1,"As redes de sensores funcionam como:",["monitores TP coordenando transações ACID","supercomputadores centralizados de alto desempenho","bancos de dados distribuídos em tempo real","clusters homogêneos executando o mesmo SO","servidores de nomes para objetos remotos"],"C","As redes de sensores capturam e compartilham informações ambientais em tempo real, funcionando como bancos de dados distribuídos."],[1,"Em uma rede de sensores com abordagem centralizada:",["não há agregação de dados, mas há grande economia de rede e de energia nos nós","os sensores dispensam bateria, pois ficam ligados diretamente ao servidor central","cada sensor processa individualmente a resposta e a envia ao operador, economizando energia","todos os dados vão a um banco central: mais gasto de rede e energia, porém mais agregação","as consultas do operador são repassadas somente aos nós relevantes da rede"],"D","Na abordagem centralizada todos os dados vão para um banco central: gasta mais rede e energia, porém com maior agregação de dados."],[1,"Qual é o trade-off da abordagem distribuída em redes de sensores?",["Maior agregação de dados, porém maior gasto de energia","Nenhum trade-off: é superior em todos os aspectos","Menor agregação, porém economia de rede e de energia","Exige que todos os sensores sejam idênticos (homogêneos)","Maior consumo de rede, porém menor consumo de energia"],"C","Na abordagem distribuída, as consultas vão aos nós relevantes, que respondem individualmente: menor agregação, mas economia de rede e energia."],[1,"O aplicativo Monitor IBUTG da Fundacentro é um exemplo de SD pervasivo que:",["monitora a exposição de trabalhadores ao calor intenso","coordena transações bancárias entre vários servidores","monitora sensores de solo e o clima para fornecer dados do campo","processa os dados científicos gerados pelo acelerador LHC","recomenda músicas, filmes e séries em ambientes domésticos"],"A","O Monitor IBUTG monitora a exposição ao calor intenso no trabalho. O AgroSMART é o que usa sensores de solo e monitoramento climático."],[1,"O software AgroSMART é citado como exemplo de:",["SD pervasivo com sensores no campo","monitor de transações (TP)","computação em grade científica","sistema de saúde eletrônico","middleware publish/subscribe"],"A","O AgroSMART é um exemplo de SD pervasivo: monitoramento climático e sensores de solo para dados do campo."],[2,"Conceitualmente, o Java RMI é:",["uma extensão do RPC adaptada à orientação a objetos e nativa do Java","um banco de dados distribuído com suporte nativo às propriedades ACID","um padrão independente de linguagem para chamadas remotas entre plataformas","um protocolo assíncrono de troca de mensagens baseado em publish/subscribe","um sistema operacional distribuído executado sobre várias JVMs em rede"],"A","O RMI é uma extensão direta da Chamada de Procedimento Remoto (RPC), adaptada à POO e nativa da plataforma Java."],[2,"Por que o RMI é considerado um middleware?",["Porque elimina a necessidade de rede ao manter os objetos na mesma memória","Porque armazena todos os objetos remotos em um banco de dados central","Porque é uma camada de software que abstrai a comunicação entre objetos","Porque substitui a JVM no lado do servidor, executando os objetos diretamente","Porque é executado dentro do kernel do sistema operacional, com alto privilégio"],"C","O RMI atua como middleware: uma camada de software que abstrai a comunicação entre objetos distribuídos."],[2,"O que o RMI permite, essencialmente?",["Que mensagens sejam guardadas e entregues a aplicações que estavam inativas","Que uma aplicação Java chame funções de qualquer linguagem sem configuração extra","Que uma thread acesse diretamente a memória de outro processo da mesma máquina","Que uma transação grande seja dividida em subtransações executadas em paralelo","Que um objeto em uma JVM invoque métodos de um objeto em outra JVM remota"],"E","O RMI permite que um objeto em uma JVM invoque métodos de um objeto localizado em outra JVM remota, abstraindo a comunicação."],[2,"Na arquitetura do RMI, qual é o papel do Servidor?",["Traduzir a chamada local do cliente em uma requisição de rede serializada","Realizar o tráfego físico e lógico dos dados serializados entre as JVMs","Iniciar a chamada remota através do componente proxy, de forma transparente","Hospedar o objeto remoto, com seu estado, interface e métodos reais","Apenas manter o registro de nomes, sem hospedar nenhum objeto remoto"],"D","O servidor hospeda o objeto remoto, gerencia seu estado, a interface exposta e os métodos reais. O cliente inicia a chamada via proxy; a rede transporta os dados serializados."],[2,"Quais componentes de baixo nível intermediam a comunicação entre cliente e objeto remoto no RMI?",["Monitor TP e Broker","Stub e Skeleton","Nó mestre e nós de computação","Publisher e Subscriber","Mutex e Lock"],"B","Stub (lado cliente) e Skeleton (lado servidor) intermediam a comunicação entre o cliente e o objeto remoto."],[2,"O que era o rmic no RMI clássico?",["O compilador que gerava manualmente os Stubs e Skeletons da classe remota","O processo que escutava a porta padrão 1099 para atender os lookups","A interface remota que todo objeto distribuído era obrigado a estender","O serviço de nomes onde os objetos remotos eram registrados e consultados","O protocolo de transporte usado pelo RMI sobre a pilha TCP/IP"],"A","No RMI clássico, o rmic gerava Stubs e Skeletons a partir da classe remota. Nas versões modernas do Java, essa geração manual não é mais necessária."],[2,"Antes da comunicação entre Stub e Skeleton ocorrer, o que o servidor faz?",["Abre uma conexão dedicada com cada cliente pela porta padrão 1099","Envia uma cópia do Skeleton para cada cliente que pretende se conectar","Serializa todos os métodos da interface e os envia ao registrador","Compila o código do cliente com rmic para gerar o Stub correspondente","Instancia o objeto remoto e o vincula a um nome no RMI Registry"],"E","Primeiro o servidor instancia o objeto remoto e o vincula a um nome no RMI Registry; só depois os clientes podem obter o stub."],[2,"O RMI Registry é:",["um escalonador da JVM que decide qual thread atende cada chamada remota","o protocolo de rede usado pelo RMI para transportar os dados serializados","um banco de dados que persiste o estado de todos os objetos remotos do servidor","um serviço de nomes para registro e descoberta de objetos remotos","o componente do lado servidor que faz o unmarshalling dos parâmetros recebidos"],"D","O RMI Registry é o serviço de nomes para registro e descoberta dos objetos remotos, parte da infraestrutura do Java RMI."],[2,"Depois que o cliente consulta o RMI Registry e obtém o Stub de um objeto remoto, o que acontece nas chamadas seguintes a esse mesmo objeto?",["O cliente passa a executar o método localmente, sem acessar a rede","O cliente precisa consultar novamente o Registry antes de cada nova chamada","Stub e skeleton se comunicam direto, sem repetir a consulta ao Registry","O Registry passa a intermediar e encaminhar todas as chamadas seguintes","O servidor precisa registrar o objeto outra vez para cada nova chamada"],"C","Após obter o stub, a comunicação ocorre diretamente entre stub e skeleton, sem repetir a consulta para chamadas subsequentes ao mesmo objeto."],[2,"Qual afirmação sobre o Stub está correta?",["Só existia no RMI clássico e foi totalmente removido no Java moderno","Atua no lado do servidor e executa a lógica de negócio do método remoto","Fica no cliente, implementa a interface remota e atua como proxy","É o serviço de nomes do RMI, usado para localizar os objetos remotos","Atua no lado do servidor, fazendo o unmarshalling dos parâmetros"],"C","O Stub fica no cliente, implementa a mesma interface remota (transparência estrutural) e age como proxy, traduzindo a invocação local em requisição de rede."],[2,"Por que o Stub implementa a mesma interface remota do servidor?",["Para dispensar a serialização dos parâmetros enviados pela rede","Para conseguir registrar o objeto remoto no RMI Registry por nome","Para garantir a transparência estrutural da chamada para o cliente","Para abrir automaticamente as portas necessárias no firewall","Para executar a lógica de negócio localmente e evitar o tráfego de rede"],"C","Implementar a mesma interface garante a transparência estrutural: o cliente chama o stub como se chamasse o objeto real."],[2,"No RMI, o processo de marshalling, realizado pelo Stub, consiste em:",["desserializar os parâmetros recebidos pela rede","gerar os Stubs e Skeletons com a ferramenta rmic","registrar o objeto remoto por nome no Registry","executar o método no objeto remoto do servidor","serializar os parâmetros da chamada para a rede"],"E","Marshalling (organização) é a serialização dos parâmetros da chamada para envio pela rede, feita pelo Stub."],[2,"Ao receber a resposta do servidor, o que o Stub faz?",["Descarta as exceções recebidas e retorna apenas os valores","Serializa os parâmetros outra vez e aguarda nova resposta","Executa novamente o método remoto para validar o resultado","Desserializa o resultado ou a exceção e entrega ao cliente","Reenvia a requisição ao Registry para confirmar o recebimento"],"D","O Stub desserializa os resultados computados ou as exceções e entrega o retorno ao cliente."],[2,"Qual componente faz o unmarshalling dos parâmetros recebidos, invoca o método no objeto remoto e serializa o retorno?",["Skeleton","RMI Registry","Stub","JRMP","Cliente"],"A","O Skeleton, no lado do servidor, desserializa (unmarshalling), invoca o método no objeto remoto e serializa o valor de retorno ou a exceção."],[2,"Qual é a sequência correta de uma invocação remota no RMI após a obtenção do Stub?",["Cliente → Stub (unmarshalling) → rede → Skeleton (marshalling) → objeto remoto","Cliente → Stub (marshalling) → rede → Skeleton (unmarshalling) → objeto remoto","Cliente → Skeleton (marshalling) → rede → Stub (unmarshalling) → objeto remoto","Cliente → RMI Registry (lookup) → objeto remoto → RMI Registry → Cliente","Cliente → objeto remoto → Stub (marshalling) → Skeleton (unmarshalling)"],"B","O stub serializa os parâmetros, a rede transporta, o skeleton desserializa e invoca o objeto; depois o skeleton serializa o retorno e o stub o desserializa para o cliente."],[2,"Qual afirmação sobre Stub e Skeleton está INCORRETA?",["O Stub realiza o marshalling dos parâmetros","O Skeleton intercepta as requisições no servidor","O Skeleton faz o unmarshalling dos parâmetros","O Stub executa a lógica de negócio no cliente","O Stub age como proxy no lado do cliente"],"D","O Stub não executa a lógica de negócio: ele apenas traduz a invocação local em requisição de rede. A lógica roda no objeto remoto do servidor."],[2,"Qual protocolo o RMI utiliza sobre TCP/IP, segundo a arquitetura apresentada?",["NTP (Network Time Protocol)","JRMP (Java Remote Method Protocol)","SSL (Secure Sockets Layer)","RPC (Remote Procedure Call)","HTTP (HyperText Transfer Protocol)"],"B","Na arquitetura do RMI, a camada de aplicação usa o JRMP (Java Remote Method Protocol), que roda sobre TCP/IP."],[2,"A vantagem do RMI que permite passar objetos complexos pela rede sem parseamento manual dos dados é:",["Transparência de rede","Serialização dinâmica","Design integrado","Comunicação síncrona","Desacoplamento temporal"],"B","Serialização dinâmica: objetos complexos são passados nativamente pela rede, sem parseamento manual."],[2,"A vantagem “Design integrado” do RMI refere-se a:",["uso de portas fixas e conhecidas, o que simplifica regras de firewall","comunicação assíncrona, em que o cliente nunca fica bloqueado","geração manual de stubs com rmic, dando controle total ao programador","integração nativa OO no Java, com tipagem forte e chamadas como locais","integração transparente com qualquer linguagem, como C# e Python"],"D","Design integrado: integração nativa OO no Java, com tipagem forte e fluidez estrutural, invocando métodos remotos como se fossem locais."],[2,"A vantagem “Transparência de rede” do RMI significa que:",["o cliente não fica bloqueado aguardando o servidor","a rede deixa de ser necessária para as chamadas remotas","não podem ocorrer falhas de comunicação entre as JVMs","qualquer linguagem passa a poder chamar objetos Java","os protocolos de baixo nível são abstraídos do programador"],"E","O RMI abstrai protocolos de baixo nível, permitindo foco na lógica de negócio."],[2,"Qual das alternativas é uma DESVANTAGEM do RMI?",["Tipagem forte nas chamadas aos métodos remotos","Integração nativa com a orientação a objetos","Serialização dinâmica de objetos complexos pela rede","Abstração dos protocolos de rede de baixo nível","Cliente bloqueado e ocioso aguardando a resposta"],"E","As desvantagens são: restrição ao ecossistema Java, comunicação síncrona (cliente bloqueado) e incompatibilidade com firewalls."],[2,"Por que o RMI é considerado incompatível com firewalls?",["Porque criptografa todas as mensagens, impedindo a inspeção do firewall","Porque após o lookup na 1099 usa uma porta aleatória com o objeto remoto","Porque usa a porta 80 do HTTP, que conflita com os servidores web","Porque exige que cliente e servidor rodem dentro da mesma JVM","Porque trafega apenas sobre UDP, que costuma ser bloqueado nos firewalls"],"B","A porta 1099 é usada no lookup; depois, uma porta aleatória é usada para conversar com o objeto remoto, o que exige ajustes no firewall."],[2,"Qual é a porta padrão usada pelo RMI para a comunicação primária (lookup)?",["3306","8080","443","1099","80"],"D","A 1099 é a porta padrão do RMI Registry para o lookup."],[2,"Por que a desvantagem “restrito ao ecossistema Java” é relevante?",["Porque integrar com outras linguagens é complexo","Porque o RMI não aceita objetos como parâmetro","Porque o Java não oferece suporte à serialização","Porque o RMI não funciona entre duas JVMs diferentes","Porque o RMI só funciona em sistemas Linux"],"A","Por ser nativo do Java, integrar o RMI com outras linguagens é complexo."],[2,"Na invocação remota, como os parâmetros trafegam pela rede?",["Como referências à memória do cliente","Somente como tipos primitivos","Como texto JSON escrito manualmente","Serializados em um array de bytes","Por memória compartilhada entre JVMs"],"D","Os parâmetros são serializados e convertidos em um array de bytes que trafega pela rede."],[2,"Ao passar o parâmetro primitivo int idade = 25 em uma chamada RMI, o que é enviado?",["Nada; primitivos não podem ser enviados","A estrutura da classe e seus metadados","Os 4 bytes que representam o número","A string “25” codificada em texto","Uma referência ao objeto Integer do cliente"],"C","Para dados primitivos, o valor bruto é serializado: no caso do int, os 4 bytes que representam o número."],[2,"Ao passar um objeto como parâmetro em uma chamada RMI, o que o RMI precisa fazer?",["Enviar apenas o endereço de memória do objeto no cliente","Serializar todo o estado e os metadados em bytes","Converter o objeto em XML antes de enviá-lo","Enviar só os atributos primitivos, ignorando os demais","Registrar o objeto no RMI Registry antes do envio"],"B","Para objetos, o RMI varre a estrutura da classe e serializa todo o estado e os metadados em um fluxo de bytes."],[2,"Onde ocorre predominantemente o tratamento das exceções de rede (falhas transitórias) no RMI?",["No cliente, onde o Stub detecta a falha","No próprio objeto remoto, dentro do método","No servidor, pelo Skeleton, antes do retorno","No RMI Registry, que reencaminha a chamada","No sistema operacional do roteador da rede"],"A","O tratamento de exceções de rede ocorre predominantemente no cliente, onde o Stub identifica a falha na comunicação."],[2,"Qual dos itens é exemplo de falha transitória citada no material de RMI?",["Erro de sintaxe na interface remota","Tipo incorreto detectado na compilação","Congestionamento da rede","Tentativa de herança múltipla","Ausência do método main()"],"C","Falhas transitórias são de infraestrutura: queda de conexão, congestionamento, indisponibilidade do serviço."],[2,"Um cliente chama “depositar(100)” remotamente, recebe uma exceção de timeout e reenvia a chamada, mas o servidor já havia executado a primeira. Que propriedade deveria ter sido projetada para evitar o depósito em dobro?",["Serialização dinâmica","Escalabilidade","Transparência de rede","Idempotência","Atomicidade"],"D","Operações idempotentes garantem que o reenvio de uma requisição interrompida não gere inconsistências ou efeitos duplicados no servidor."],[2,"Qual é a ordem correta dos passos de implementação de uma aplicação RMI?",["Cliente → interface remota → implementação → servidor → rodar cliente → rodar servidor","Interface remota → cliente → rodar cliente → implementação → servidor → rodar servidor","Interface remota → implementação → servidor → cliente → rodar servidor → rodar cliente","Servidor → cliente → interface remota → implementação → rodar ambos ao mesmo tempo","Implementação → interface remota → cliente → servidor → rodar cliente → rodar servidor"],"C","1) interface remota; 2) classe que a implementa; 3) servidor (Registry, instância e registro); 4) cliente; 5) executar o servidor; 6) executar o cliente."],[2,"Qual é o primeiro passo na implementação de uma aplicação RMI?",["Executar o cliente e o servidor","Escrever o código da aplicação cliente","Iniciar o RMI Registry na porta 1099","Gerar o Skeleton com a ferramenta rmic","Definir a interface remota"],"E","O primeiro passo é definir a interface remota com os métodos disponibilizados para a rede."],[2,"O que o projeto do cliente RMI precisa possuir para obter e usar a referência do Stub?",["Uma cópia da classe que implementa o objeto","Acesso direto ao banco do servidor","O código-fonte do Skeleton do servidor","Uma cópia da interface remota","Uma instância própria do RMI Registry"],"D","O cliente consulta o registrador para obter o Stub, e o projeto precisa ter uma cópia da interface remota."],[2,"No código do servidor RMI (passo 3), o que deve ser feito?",["Abrir manualmente a porta aleatória no firewall do cliente","Definir a interface remota com os métodos disponibilizados","Iniciar o Registry, instanciar o objeto remoto e registrá-lo","Executar o cliente para iniciar a invocação dos métodos","Consultar o registrador para obter o Stub do objeto remoto"],"C","O servidor inicializa o RMI Registry, instancia o objeto remoto e o registra no serviço de nomes."],[2,"Qual problema o material aponta quando múltiplos clientes acessam simultaneamente o mesmo objeto remoto?",["O RMI Registry deixa de responder aos lookups","Podem ocorrer conflitos e inconsistências de estado","A porta 1099 é bloqueada para novos clientes","Nenhum; o RMI serializa o acesso automaticamente","O stub precisa ser recriado a cada nova chamada"],"B","Múltiplos clientes acessando o mesmo objeto remoto simultaneamente podem gerar conflitos e inconsistências de estado (concorrência)."],[2,"Na arquitetura do RMI, o papel da Rede é:",["iniciar a chamada por meio do proxy do cliente","hospedar o objeto remoto e gerenciar seu estado","executar os métodos reais do objeto remoto","transportar os dados serializados entre as JVMs","manter o registro de nomes dos objetos remotos"],"D","A rede realiza o tráfego físico e lógico dos dados serializados entre as JVMs."],[2,"Na arquitetura do RMI, o Cliente:",["serializa o valor de retorno do método remoto","hospeda o objeto remoto e gerencia o seu estado","executa os métodos reais e devolve o resultado","inicia a chamada e invoca o método via proxy (Stub)","realiza o unmarshalling dos parâmetros recebidos"],"D","O cliente inicia a chamada e invoca o método remoto por meio do proxy (Stub), de forma transparente."],[3,"O que a arquitetura de um sistema distribuído define?",["Como os componentes se organizam, suas responsabilidades e interações","Apenas o protocolo de rede usado na troca de mensagens entre as máquinas","Apenas o hardware utilizado em cada nó e a topologia física da rede","A ordem de execução das threads definida pelo escalonador de cada nó","Somente a linguagem de programação e os frameworks adotados no projeto"],"A","A arquitetura define a estrutura organizacional do software: arranjo dos componentes, responsabilidades e forma de interação."],[3,"No contexto de arquitetura de SDs, um componente é:",["uma thread do sistema operacional que executa uma sequência de instruções","um usuário ou perfil de acesso cadastrado para utilizar o sistema","um equipamento de interconexão, como switches, roteadores e cabos de rede","uma parte do sistema responsável por uma função, como a autenticação","um computador físico da rede, como um servidor ou uma estação de trabalho"],"D","Um componente é uma unidade funcional modular, responsável por uma função (autenticação, pedidos, armazenamento...)."],[3,"Segundo o material, a escolha arquitetural determina:",["onde cada componente executa e também como ele irá operar","somente a interface gráfica apresentada aos usuários finais","apenas em qual máquina cada componente será executado","apenas o custo do hardware necessário para cada servidor","apenas a linguagem de programação usada em cada módulo"],"A","A escolha arquitetural não determina apenas onde cada componente executa, mas também como eles irão operar."],[3,"Qual dos aspectos abaixo NÃO é citado como diretamente relacionado à arquitetura de um SD?",["Sintaxe da linguagem","Compartilhamento de recursos","Escalabilidade","Tolerância a falhas","Desempenho"],"A","A arquitetura se relaciona com desempenho, escalabilidade, disponibilidade, tolerância a falhas, segurança e compartilhamento de recursos."],[3,"Qual é a diferença entre arquitetura lógica e física?",["A lógica trata apenas dos bancos de dados; a física trata apenas das redes","A lógica divide as funções em componentes; a física define onde eles executam","A física descreve o código-fonte do sistema; a lógica descreve os servidores","A lógica descreve onde os componentes executam; a física, como as funções são divididas","Não há diferença: são dois nomes para a mesma visão da arquitetura"],"B","Lógica: divisão das funcionalidades em componentes e seus relacionamentos. Física: onde os componentes executam (computadores, servidores, dispositivos)."],[3,"Um diagrama mostra que o serviço de autenticação roda no servidor S1 e o banco de dados no servidor S2. Esse diagrama representa qual aspecto da arquitetura?",["Centrado em dados","Em camadas","Físico","Orientado a eventos","Lógico"],"C","Descrever onde os componentes são executados (quais máquinas) é a arquitetura física."],[3,"No exemplo do e-commerce, o módulo de pedidos solicita ao módulo de pagamentos que processe a cobrança. O que esse exemplo destaca?",["Que o sistema é necessariamente centralizado em um único servidor","Que pedidos e pagamentos precisam rodar dentro do mesmo processo","Que a comunicação entre os módulos deve ser por memória compartilhada","Que o solicitante precisa conhecer os detalhes internos do outro módulo","Que o solicitante não precisa conhecer como o outro executa a tarefa"],"E","A troca de mensagens permite que o solicitante não conheça os detalhes internos do outro, dividindo o sistema em partes com responsabilidades específicas."],[3,"Sobre os estilos arquiteturais, o material afirma que:",["a arquitetura em camadas é a mais adequada para todos os SDs","o estilo orientado a eventos substituiu todos os demais estilos","todo SD precisa ser centrado em um repositório de dados único","o estilo depende exclusivamente da linguagem de programação","nenhum estilo serve para todos; a escolha depende da aplicação"],"E","Não existe estilo único: a escolha depende da aplicação, usuários, compartilhamento de dados, comunicação, desempenho e disponibilidade."],[3,"Qual alternativa lista corretamente os estilos arquiteturais (formas de organização) apresentados?",["Centralizada, descentralizada, híbrida e microsserviços","Cliente, servidor, rede, middleware e registro","Base, conectividade, recursos, coletiva e aplicação","Cluster, grade, transações, EAI e pervasiva","Camadas, objetos, serviços, centrada em dados e eventos"],"E","Os estilos são: em camadas, baseada em objetos, baseada em serviços, centrada em dados e orientada a eventos. Centralizada/descentralizada/híbrida é a classificação quanto à distribuição."],[3,"Na arquitetura em camadas:",["todas as funções ficam concentradas em um único componente central","cada camada pode se comunicar livremente com todas as outras camadas","os componentes publicam eventos em tópicos e outros se inscrevem","cada camada usa serviços de outra e fornece serviços às dependentes","todos os componentes leem e gravam em um mesmo repositório comum"],"D","Cada camada usa serviços de outra e fornece serviços às dependentes, separando responsabilidades."],[3,"Sobre a arquitetura em camadas, qual afirmação está correta?",["A arquitetura em camadas é sempre física, nunca uma divisão lógica","As camadas são uma organização lógica, não exigem máquinas distintas","Cada camada precisa obrigatoriamente executar em uma máquina distinta","Camadas só existem em sistemas pervasivos com dispositivos móveis","A divisão em camadas impede a separação de responsabilidades"],"B","As camadas são, inicialmente, uma organização lógica; podem ou não estar em máquinas distintas."],[3,"A arquitetura MVC (Model-View-Controller), com apresentação, regras de negócio e acesso a dados, é citada como exemplo de qual estilo?",["Em camadas","Baseado em objetos","Centrado em dados","Orientado a eventos","Peer-to-peer"],"A","O MVC é o exemplo dado para a arquitetura em camadas."],[3,"Em qual estilo arquitetural as funcionalidades são organizadas em entidades que possuem dados e operações, podendo um componente solicitar a execução de uma operação em uma entidade localizada remotamente (invocação remota)?",["Baseada em objetos","Centrada em dados","Em camadas","Orientada a eventos","Híbrida"],"A","Na arquitetura baseada em objetos, objetos têm dados e operações e podem ser invocados remotamente. O exemplo citado é o RMI."],[3,"O Java RMI é citado como exemplo de qual estilo arquitetural?",["Arquitetura em camadas (MVC)","Arquitetura orientada a eventos","Arquitetura centrada em dados","Arquitetura baseada em objetos","Arquitetura descentralizada P2P"],"D","A invocação remota de métodos (RMI) é o exemplo da arquitetura baseada em objetos."],[3,"Uma aplicação possui um componente responsável por usuários, outro por produtos e outro por pagamentos, cada um com responsabilidade definida e uma forma de comunicação para ser utilizado. Esse é o estilo:",["Baseado em serviços","Em camadas","Orientado a eventos","Centralizado","Centrado em dados"],"A","Na arquitetura baseada em serviços, componentes oferecem serviços com responsabilidade definida e forma de comunicação definida."],[3,"Na arquitetura baseada em serviços, sobre a localização dos serviços é correto afirmar:",["podem estar no mesmo computador ou em computadores diferentes","devem obrigatoriamente estar em computadores diferentes entre si","devem estar sempre hospedados em um provedor de nuvem","devem compartilhar um mesmo banco de dados centralizado","devem obrigatoriamente estar juntos no mesmo computador"],"A","Os serviços podem estar no mesmo ou em computadores diferentes; o aspecto principal é a separação de responsabilidades."],[3,"Na arquitetura centrada em dados, qual é o principal cuidado necessário?",["Evitar qualquer tipo de repositório compartilhado no sistema","Definir como os dados são acessados e manter a consistência","Executar todos os componentes dentro do mesmo processo","Garantir que cada componente tenha seu próprio banco isolado","Usar somente comunicação publish/subscribe entre componentes"],"B","Como vários componentes acessam o mesmo repositório, é preciso definir consultas/modificações e manter a consistência."],[3,"Segundo a observação sobre arquitetura centrada em dados, quem já trata do controle de acesso concorrente para garantir a consistência?",["O escalonador do sistema operacional","O nó mestre do cluster Beowulf","O RMI Registry do servidor","Os SGBDs modernos, via ACID","O broker de eventos da aplicação"],"D","SGBDs modernos já tratam o controle de acesso concorrente aos dados, garantindo ACID."],[3,"Na arquitetura orientada a eventos, o que é um evento?",["Uma chamada síncrona a um método de um objeto remoto","Uma das camadas da arquitetura Model-View-Controller","Uma interrupção gerada pelo relógio de hardware","A ocorrência de algo relevante, como “pedido criado”","Um registro gravado no banco de dados compartilhado"],"D","Um evento representa a ocorrência de algo relevante: pedido criado, pagamento recebido, login/logout etc."],[3,"Na arquitetura orientada a eventos, o componente que produz o evento:",["é sempre o servidor central que coordena todo o sistema","não precisa conhecer os componentes que irão utilizá-lo","precisa conhecer diretamente todos os componentes que irão consumi-lo","deve gravar o evento diretamente na memória de cada consumidor","deve aguardar a confirmação de cada consumidor antes de prosseguir"],"B","O produtor não precisa conhecer os consumidores; por isso essa interação é chamada de comunicação indireta."],[3,"Por que a interação na arquitetura orientada a eventos é chamada de comunicação indireta?",["Porque os componentes não se comunicam diretamente","Porque as mensagens passam pelo kernel do sistema","Porque utiliza sempre o protocolo UDP em vez do TCP","Porque depende de um banco de dados compartilhado","Porque o usuário final não participa da comunicação"],"A","É indireta porque os componentes não estabelecem comunicação direta entre si; há um intermediário."],[3,"Qual é a diferença entre comunicação direta e indireta?",["Não há diferença prática; ambas exigem conexão ponto a ponto","A indireta só ocorre em clusters; a direta só ocorre em grades","A direta é sempre assíncrona, enquanto a indireta é sempre síncrona","Na direta há um broker intermediário; na indireta o emissor conhece o destino","Na direta o emissor conhece o destino; na indireta há um intermediário"],"E","Direta: o componente conhece o destinatário (ex.: aplicação → sistema de pagamentos). Indireta: usa um intermediário, como no publish/subscribe."],[3,"No exemplo de publish/subscribe, a aplicação de vendas publica “pedido criado”. O que faz o broker (corretor)?",["Descarta a mensagem se algum dos assinantes estiver ocupado","Distribui a mesma mensagem a todos os assinantes interessados","Processa o pagamento diretamente, sem envolver outros serviços","Consolida as respostas e devolve o resultado à aplicação de vendas","Entrega a mensagem somente ao primeiro assinante disponível no momento"],"B","O broker (barramento de eventos) distribui a mesma mensagem a todos os assinantes interessados (pagamento, estoque, fraude), que podem publicar suas deliberações em outros canais."],[3,"Na classificação “quanto à distribuição”, o que é analisado além da organização lógica dos componentes?",["Somente o layout da interface gráfica para o usuário","Como processamento, dados e controle são distribuídos","Apenas a quantidade de usuários simultâneos do sistema","A versão do sistema operacional de cada computador","A linguagem de programação adotada em cada componente"],"B","Quanto à distribuição, analisa-se como processamento, dados e controle são distribuídos entre os computadores."],[3,"Segundo Tanenbaum & Steen (2007), um SD é dito centralizado quando:",["combina funções centralizadas com funções distribuídas entre nós","todos os nós compartilham o mesmo processador e a mesma memória","os participantes atuam ao mesmo tempo como clientes e servidores","um único nó central trata as requisições e o controle do sistema","não existe um único ponto de controle entre os nós participantes"],"D","Centralizado: um único nó central trata requisições e controle; os demais são terminais/clientes."],[3,"Sobre a arquitetura centralizada, qual afirmação está correta?",["Escala horizontalmente adicionando novos nós de controle","Elimina o ponto único de falha ao concentrar o controle","Não utiliza mensagens de requisição e resposta entre processos","Mesmo fisicamente distribuída, comporta-se como entidade única","Por ser centralizada, não pode estar fisicamente distribuída"],"D","A arquitetura centralizada pode ser fisicamente distribuída, mas se comporta como entidade única, com o nó central coordenando."],[3,"Na arquitetura centralizada, como se dá a interação entre os processos?",["Todos os nós atuam como pares iguais, sem papéis definidos","Por eventos emitidos sem destinatário definido previamente","Por memória compartilhada entre os processos das máquinas","Clientes consomem serviços de servidores via request/response","Por publicação de mensagens em tópicos e inscrição de assinantes"],"D","Os processos se dividem em servidores e clientes, interagindo por request/response."],[3,"Qual das alternativas é uma VANTAGEM da centralização?",["Elimina o ponto único de falha do sistema","Distribui a tomada de decisão entre os nós","Simplifica o controle da consistência dos dados","Permite escalar ilimitadamente e sem custo","Dispensa o uso de um servidor dedicado"],"C","Vantagens da centralização: segurança aplicada em ponto central, manutenção facilitada e consistência simplificada (menos locais modificam os dados)."],[3,"Um componente central recebe muitas solicitações simultâneas e passa a limitar o desempenho do conjunto. Esse problema é chamado de:",["Ponto único de falha","Race condition","Desacoplamento temporal","Gargalo","Deadlock"],"D","Gargalo é uma parte do sistema que limita o desempenho do conjunto, comum em componentes centrais sobrecarregados."],[3,"Se o componente central deixa de funcionar e não há outro capaz de assumir suas funções, o sistema fica indisponível. Esse problema é chamado de:",["Latência","Deadlock","Condição de corrida","Gargalo","Ponto único de falha"],"E","Ponto único de falha: uma única falha pode comprometer parte significativa (ou todo) o sistema."],[3,"Em uma arquitetura centralizada, como costuma ser feita a expansão para atender mais demanda, e qual é sua limitação?",["Criando mais threads no servidor; limitada pela ocorrência de deadlock","Servidor central mais potente (vertical); limites físicos e econômicos","Adicionando nós pares que dividem a carga; limitada pela consistência","Distribuindo eventos entre assinantes; limitada pelo broker central","Migrando para P2P; limitada pela descoberta autônoma dos nós"],"B","Na centralizada, escala-se verticalmente (servidor mais potente), o que tem limites físicos e econômicos."],[3,"Quais exemplos são dados para a arquitetura centralizada?",["BitTorrent e Blockchain","Sistemas Web tradicionais e sistema bancário","AgroSMART e Monitor IBUTG","Redes de sensores e redes corporais (BANs)","WLCG do CERN e SPRACE da Unesp"],"B","Sistemas Web tradicionais e sistema bancário são os exemplos de arquitetura centralizada. BitTorrent e Blockchain são P2P (descentralizada)."],[3,"Tanenbaum & Steen (2007) definem a arquitetura descentralizada como aquela caracterizada:",["pela substituição de vários servidores por um único mais potente","pela ausência de um único ponto de controle entre nós cooperativos","por um nó central que recebe e controla todas as requisições do sistema","pelo uso exclusivo de mensagens síncronas entre clientes e servidores","por um repositório central compartilhado por todos os componentes"],"B","Descentralizada: ausência de um único ponto de controle; múltiplos nós cooperativos com decisão, armazenamento e processamento distribuídos."],[3,"O que Coulouris, Dollimore & Kindberg (2012) acrescentam sobre os SDs descentralizados?",["Que costumam ter descoberta autônoma e comunicação direta entre os nós","Que não toleram falhas, pois cada nó guarda uma parte única dos dados","Que eles sempre dependem de um servidor de nomes central para funcionar","Que só funcionam em redes locais de alta velocidade e baixa latência","Que são sempre mais simples de manter do que os sistemas centralizados"],"A","Coulouris et al. destacam mecanismos autônomos de descoberta e comunicação direta entre nós, sem passar tudo por um servidor central."],[3,"O que caracteriza as redes P2P (peer-to-peer)?",["Todos os nós funcionam apenas como terminais sem processamento","Um servidor central atende todos os recursos solicitados pelos nós","Cada participante pode ser cliente e servidor ao mesmo tempo","A comunicação é sempre mediada por um broker de eventos","Só existem em clusters homogêneos com o mesmo sistema operacional"],"C","Em P2P os participantes são cliente e servidor ao mesmo tempo, compartilhando recursos (ex.: BitTorrent, Blockchain)."],[3,"Qual das alternativas é um DESAFIO da arquitetura descentralizada?",["Menor tolerância a falhas que a centralizada","Gargalo de requisições no nó central","Maior complexidade de implementação e gestão","Ponto único de falha no nó coordenador","Impossibilidade de adicionar novos nós"],"C","A descentralização permite adicionar nós e aumenta a tolerância a falhas, mas aumenta a complexidade de implementação, manutenção e gerenciamento."],[3,"Na arquitetura descentralizada, se um nó modifica uma informação, como garantir que os demais tenham dados compatíveis?",["É um problema complexo que exige mecanismos de sincronização","Basta marcar os métodos de acesso como synchronized em Java","Não é necessário, pois cada nó mantém dados próprios e independentes","Basta desligar os nós desatualizados até que a rede se estabilize","Basta substituir os nós por um único servidor mais potente"],"A","A consistência em sistemas descentralizados é complexa (dados dispersos, falhas, atrasos) e requer mecanismos de sincronização."],[3,"Uma plataforma de distribuição de conteúdo tem um componente central para gerenciar usuários, autenticação e organização do conteúdo, e servidores distribuídos que fornecem os arquivos. Qual arquitetura é essa?",["Centralizada","Descentralizada P2P","Híbrida","Centrada em dados","Em camadas"],"C","Arquitetura híbrida: funções de maior controle centralizadas (usuários/autenticação) e funções de distribuição (arquivos) distribuídas."],[3,"Na arquitetura híbrida, quais funções tendem a permanecer centralizadas e quais distribuídas?",["Processamento centralizado; gerenciamento de usuários distribuído","Gerência de usuários centralizada; processamento distribuído","Todas as funções ficam centralizadas em um único servidor","Apenas o banco de dados é distribuído; o restante é centralizado","Todas as funções ficam distribuídas, sem nenhum controle central"],"B","Funções de maior controle ficam centralizadas; funções que pedem capacidade de distribuição (processamento) ficam distribuídas."],[3,"Qual é a principal desvantagem da arquitetura híbrida?",["Impossibilidade de escalar o processamento distribuído","Maior complexidade para coordenar partes diferentes","Não permite autenticação centralizada de usuários","Exige hardware homogêneo em todos os servidores","Ponto único de falha inevitável em todas as funções"],"B","A combinação aumenta a complexidade de implementação e manutenção: segurança uniforme, sincronização e tráfego de rede."],[3,"Como os microsserviços são definidos no material?",["Threads leves criadas dentro de um mesmo processo da aplicação","Uma aplicação monolítica única executada em um só servidor central","Pequenos serviços relativamente independentes, cada um com uma capacidade","As três camadas do padrão MVC executando em máquinas separadas","Um tipo de rede de sensores de baixo consumo para dados ambientais"],"C","Microsserviços: pequenos serviços relativamente independentes, cada um responsável por uma capacidade (usuários, produtos, pedidos, pagamentos)."],[3,"Qual afirmação sobre as arquiteturas quanto à distribuição está INCORRETA?",["A descentralizada dispensa mecanismos de sincronização","A centralizada aplica regras de segurança em um ponto central","A híbrida combina características centralizadas e descentralizadas","A descentralizada aumenta a tolerância a falhas do sistema","A centralizada pode tornar-se um gargalo quando sobrecarregada"],"A","Pelo contrário: na descentralizada, a consistência dos dados é um problema complexo que exige mecanismos de sincronização."],[4,"A arquitetura básica de processador apresentada no material, datada de 1945, é a arquitetura de:",["Von Neumann","Amdahl","Harvard modificada","Flynn","Moore"],"A","O material apresenta a Arquitetura de Von Neumann (1945) como arquitetura básica de um processador."],[4,"Como o material define concorrência?",["Duas ou mais tarefas executando exatamente no mesmo instante em núcleos diferentes","A divisão de um programa em uma parte sequencial e uma parte paralelizável","Tarefas progredindo em intervalos sobrepostos, podendo alternar em uma só CPU","O uso de vários computadores homogêneos interligados em um cluster local","A execução de uma tarefa por vez, do início ao fim, sem nenhuma interrupção"],"C","Concorrência: tarefas progridem em intervalos sobrepostos; em uma única CPU, por alternância (intercalação) das execuções."],[4,"Como o material define paralelismo?",["Compartilhamento do espaço de memória entre as threads de um mesmo processo","Alternância rápida de várias tarefas em uma única CPU, dando sensação de simultaneidade","Troca de mensagens entre processos distintos por meio de mecanismos do SO","Tarefas executando de fato ao mesmo tempo em unidades de processamento diferentes","Execução sequencial das tarefas, respeitando a prioridade definida pelo escalonador"],"D","Paralelismo: execução efetivamente simultânea em unidades diferentes; depende de poder dividir o trabalho e dos núcleos disponíveis."],[4,"Um computador com um único núcleo alterna rapidamente entre três tarefas, que progridem em intervalos sobrepostos. Isso caracteriza:",["Threads de hardware via SMT","Paralelismo real entre as tarefas","Computação em grade (Grid)","Deadlock entre as três tarefas","Concorrência sem execução simultânea"],"E","Com um único núcleo, o SO intercala as tarefas: há concorrência, mas não execução simultânea (paralelismo)."],[4,"Por que nem todo trabalho pode ser paralelizado?",["Porque as CPUs modernas possuem apenas um núcleo físico","Porque o SO proíbe que um processo tenha mais de uma thread","Porque algumas etapas dependem de resultados anteriores","Porque o paralelismo sempre acaba gerando um deadlock","Porque a JVM não oferece suporte à criação de threads"],"C","Algumas etapas dependem de resultados anteriores e exigem ordem definida; outras podem ser executadas independentemente."],[4,"O que estabelece a Lei de Amdahl?",["Que dobrar o número de núcleos sempre dobra o desempenho de qualquer programa","Que o speedup cresce indefinidamente à medida que se adicionam mais núcleos","Que o ganho com o paralelismo é limitado pela parte que continua sequencial","Que threads são sempre mais rápidas que processos, por compartilharem memória","Que o número de transistores em um chip dobra aproximadamente a cada dois anos"],"C","A Lei de Amdahl diz que o speedup é limitado pela fração sequencial do programa."],[4,"Qual é a fórmula da Lei de Amdahl, sendo p a fração paralelizável e n o número de núcleos?",["S(n) = 1 / ((1 − p) + p/n)","S(n) = n × p","S(n) = 1 / (p + (1 − p)/n)","S(n) = n / (1 − p)","S(n) = (1 − p) + p × n"],"A","S(n) = 1 / ((1 − p) + p/n): a parte sequencial (1 − p) não se divide; só a parte paralelizável p é dividida por n."],[4,"Na Lei de Amdahl, o termo (1 − p) representa:",["o fator de aceleração (speedup) obtido","a fração sequencial que permanece inalterada","a fração do código que pode ser paralelizada","o número total de núcleos utilizados","o custo de criação e sincronização das threads"],"B","p é a proporção paralelizável (0 a 1); 1 − p é a fração sequencial que não se beneficia de mais núcleos."],[4,"Um programa leva 100 s: 20 s são obrigatoriamente sequenciais e 80 s são paralelizáveis. Com 4 núcleos, quanto tempo ele levará (Lei de Amdahl)?",["50 s","40 s","20 s","25 s","80 s"],"B","A parte sequencial continua com 20 s e os 80 s divididos por 4 viram 20 s: 20 + 20 = 40 s."],[4,"No exemplo de 100 s (20 s sequenciais e 80 s paralelizáveis) executado com 4 núcleos, qual é a aceleração (speedup) obtida?",["2,5","1,25","4","2","5"],"A","S(4) = 1 / (0,2 + 0,8/4) = 1 / 0,4 = 2,5. Ou: 100 s / 40 s = 2,5. Quatro núcleos NÃO tornam a execução 4 vezes mais rápida."],[4,"No mesmo programa (20% sequencial e 80% paralelizável), qual é o speedup máximo teórico, mesmo com uma quantidade ilimitada de núcleos?",["10","4","80","Infinito","5"],"E","Com infinitos núcleos, a parte paralela tende a 0 e restam os 20 s sequenciais: 100/20 = 5, ou 1/(1 − 0,8) = 5."],[4,"Um programa de 100 s tem 50% de código paralelizável. Executando-o com 2 núcleos, qual será o tempo total, segundo Amdahl?",["25 s","100 s","75 s","50 s","66 s"],"C","Parte sequencial: 50 s. Parte paralela: 50 s / 2 = 25 s. Total: 75 s (speedup ≈ 1,33)."],[4,"Se 90% de um programa é paralelizável (p = 0,9), qual é o limite máximo de aceleração, independentemente do número de núcleos?",["90","Ilimitado","10","1,9","9"],"C","O limite é 1/(1 − p) = 1/0,1 = 10."],[4,"Para p = 0,75 (75% paralelizável) e n = 3 núcleos, qual é o speedup S(n) segundo Amdahl?",["3","2,25","1,5","2","4"],"D","S(3) = 1 / (0,25 + 0,75/3) = 1 / (0,25 + 0,25) = 1 / 0,5 = 2."],[4,"O que a Lei de Amdahl, em sua formulação clássica, NÃO considera?",["O fator de aceleração (speedup) obtido","A fração sequencial do programa","Os custos de criar e sincronizar threads","A fração do programa que é paralelizável","O número de núcleos utilizados"],"C","A formulação clássica ignora custos como criação, gerenciamento e sincronização de threads, além de comunicação e acesso à memória; ela serve para estimar limites."],[4,"Qual sequência resume a evolução do hardware apresentada na síntese?",["Multinúcleo → mais transistores → limitações térmicas → mais capacidade","Mais transistores → multinúcleo → mais capacidade → limitações térmicas","Limitações térmicas → mais transistores → mais capacidade → monoprocessador","Mais capacidade → multinúcleo → mais transistores → limitações energéticas","Mais transistores → mais capacidade → limites térmicos → multinúcleo"],"E","Mais transistores → mais capacidade → limitações térmica/energética → multinúcleo."],[4,"Qual sequência resume a evolução dos sistemas operacionais apresentada na síntese?",["Compartilhamento → um programa por vez → multiprogramação → execução concorrente","Um programa por vez → multiprogramação → compartilhamento → execução concorrente","Um programa por vez → execução concorrente → compartilhamento → multiprogramação","Execução concorrente → um programa por vez → multiprogramação → compartilhamento","Multiprogramação → um programa por vez → execução concorrente → compartilhamento"],"B","Um programa por vez → multiprogramação → compartilhamento do processador → execução concorrente."],[4,"Segundo Tanenbaum, o que é um processo?",["Um núcleo físico do processador capaz de manter vários contextos de execução","Um arquivo executável gerado pelo compilador a partir do código-fonte","Um conjunto de instruções armazenadas em disco, ainda não carregado na memória","Um programa em execução, que funciona como um processador virtual dedicado","A menor unidade de execução que pode ser escalonada pelo sistema operacional"],"D","Processo é um programa em execução; para o SO, é um processador virtual dedicado, monitorado pela Tabela de Processos."],[4,"Qual é a diferença entre programa e processo?",["O programa é uma thread; o processo é o núcleo que executa essa thread","Não há diferença: programa e processo são sinônimos para o sistema operacional","O programa é passivo (instruções); o processo é sua instância em execução","O processo é o código-fonte; o programa é o binário gerado pelo compilador","O programa é uma entidade ativa; o processo é a entidade passiva armazenada"],"C","O programa é passivo (instruções armazenadas); o processo é uma instância em execução."],[4,"Quais comandos são citados para visualizar processos em execução no Windows (terminal) e no Linux, respectivamente?",["taskkill; kill","netstat; ifconfig","ps; tasklist","tasklist; top e htop","dir; ls"],"D","No Windows: Gerenciador de Tarefas ou tasklist. No Linux: top e htop."],[4,"Na Tabela de Processos, cada processo possui uma entrada chamada:",["MMU – Memory Management Unit","TCB – Thread Control Block","PIB – Process Identifier Block","IPC – Inter Process Communication","PCB – Process Control Block"],"E","Cada processo tem uma entrada PCB (Process Control Block) com o contexto completo para o SO gerenciá-lo."],[4,"No PCB, registradores, contador de programa e ponteiros de pilha pertencem a qual grupo de informações?",["Contexto da CPU","Gerenciamento de memória","Política de escalonamento","Recursos de E/S","Informações de controle"],"A","O contexto da CPU (registradores, PC, ponteiros de pilha) é necessário para retomar a execução."],[4,"No PCB, arquivos abertos e dispositivos usados pelo processo pertencem a qual grupo?",["Contexto da CPU","Informações de controle","Gerenciamento de memória","Recursos de E/S","Espaço de endereçamento"],"D","Recursos de E/S: arquivos abertos e dispositivos usados pelo processo."],[4,"No PCB, identificador do processo, estado, prioridade, tempo de CPU e privilégios de acesso pertencem a qual grupo?",["Informações de controle","Recursos de E/S","Tabela de páginas","Gerenciamento de memória","Contexto da CPU"],"A","Informações de controle: PID, estado, prioridade, tempo de CPU e privilégios."],[4,"Sobre o isolamento e a proteção entre processos, qual afirmação está correta?",["Ajuda na estabilidade, mas não garante que falhas nunca se propaguem","Elimina a necessidade de mecanismos de IPC entre processos","Existe apenas em sistemas Linux, não em sistemas Windows","Permite que os processos compartilhem livremente a memória entre si","Garante que a falha de um processo jamais comprometa outros processos"],"A","O isolamento contribui para a estabilidade (falhas tendem a ficar restritas), mas não garante que nunca afetem outros processos."],[4,"Um processo está aguardando a conclusão de uma leitura em disco. Em qual estado básico ele se encontra?",["Executando","Pronto","Novo","Finalizado","Bloqueado"],"E","Bloqueado: aguarda uma operação de E/S ou outro evento. Pronto: aguarda a CPU. Executando: instruções sendo executadas."],[4,"Um processo tem tudo de que precisa para executar, mas aguarda a disponibilidade de uma CPU. Em qual estado ele está?",["Bloqueado","Pronto","Finalizado","Novo","Executando"],"B","No estado Pronto, o processo aguarda a disponibilidade de uma CPU."],[4,"Além de pronto, executando e bloqueado, quais estados completam o ciclo de vida de um processo?",["Ativo e inativo","Novo e finalizado","Mestre e escravo","Suspenso e zumbi","Waiting e timed_waiting"],"B","O ciclo de vida completo inclui a criação (novo) e o encerramento (finalizado)."],[4,"Por que a criação de um processo tem custo computacional?",["Porque exige reiniciar os serviços do sistema operacional","Porque o processo precisa ser enviado pela rede ao servidor","Porque exige recompilar o programa a partir do código-fonte","Porque o SO registra, configura a memória e
